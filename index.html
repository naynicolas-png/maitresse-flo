<script type="text/babel">
const {useState,useEffect,useCallback,useRef} = React;

/* ── Couleurs ── */

const SECTIONS=[

const MATIERES_DEF=["Français","Mathématiques","Sciences","Histoire-Géo","Arts visuels","Éducation musicale","EPS","EMC","Anglais","Technologie"];
const JOURS=["Lundi","Mardi","Mercredi","Jeudi","Vendredi"];

/* ── Configuration JSONBin ── */
const JSONBIN_BIN_ID = "6a26a05bf5f4af5e29caafc3";
const JSONBIN_API_KEY = "$2a$10$Rbw7MnOz6LSTmjPTBs/43uQodD/3FiEQNSbWzGZ5L3VObcmgcf9Wq";
const JSONBIN_URL = `https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}`;

/* Mot de passe hashé SHA-256 de "Florence2024" — modifiable */
const MOT_DE_PASSE_HASH = "a3f8e2b1c4d7f9e0a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4";

async function sha256(str){
  const buf=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
}

/* ── Stockage JSONBin ── */
let _cache = null;       // cache local des données
let _saveTimeout = null; // debounce sauvegarde

async function loadData(){
  try{
    const r=await fetch(JSONBIN_URL+"/latest",{
      headers:{"X-Access-Key":JSONBIN_API_KEY,"X-Bin-Meta":false}
    });
    const d=await r.json();
    _cache=d||{};
    return _cache;
  }catch(e){
    console.warn("JSONBin lecture échouée, utilisation localStorage",e);
    try{const s=localStorage.getItem("maitresse_backup");return s?JSON.parse(s):{};} catch{return {};}
  }
}

async function saveData(data){
  _cache=data;
  // Backup localStorage en cas de panne réseau
  try{localStorage.setItem("maitresse_backup",JSON.stringify(data));}catch{}
  try{
    await fetch(JSONBIN_URL,{
      method:"PUT",
      headers:{"Content-Type":"application/json","X-Access-Key":JSONBIN_API_KEY},
      body:JSON.stringify(data)
    });
  }catch(e){console.warn("JSONBin sauvegarde échouée",e);}
}

function debounceSave(data){
  if(_saveTimeout)clearTimeout(_saveTimeout);
  _saveTimeout=setTimeout(()=>saveData(data),1200);
}

/* ── Hook useCloud ── */
function useCloud(key,def,globalData,setGlobalData){
  const val = globalData?.[key]??def;
  const set = useCallback(v=>{
    const next={...globalData,[key]:v};
    setGlobalData(next);
    debounceSave(next);
  },[key,globalData,setGlobalData]);
  return [val,set];
}

/* ── Appel IA (optionnel) ── */
async function callIA(sys,user,apiKey){
  const r=await fetch("https://api.anthropic.com/v1/messages",{
    method:"POST",
    headers:{"Content-Type":"application/json","x-api-key":apiKey,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
    body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:1500,system:sys,messages:[{role:"user",content:user}]})
  });
  const d=await r.json();
  if(d.error)throw new Error(d.error.message);
  return d.content?.[0]?.text||"";
}

/* ── Écran connexion ── */
function LoginScreen({onLogin}){
  const [pwd,setPwd]=useState("");
  const [err,setErr]=useState("");
  const [loading,setLoading]=useState(false);

  const login=async()=>{
    setLoading(true);setErr("");
    const hash=await sha256(pwd);
    if(hash===MOT_DE_PASSE_HASH){
      sessionStorage.setItem("maitresse_auth","1");
      onLogin();
    } else {
      setErr("Mot de passe incorrect.");
    }
    setLoading(false);
  };

  return(
    <div style={{display:"flex",alignItems:"center",justifyContent:"center",minHeight:"100vh",background:"#faf8f3",padding:24}}>
      <div style={{maxWidth:400,width:"100%"}}>
        <div style={{textAlign:"center",marginBottom:32}}>
          <div style={{fontSize:56,marginBottom:12}}>🍎</div>
          <h1 style={{fontFamily:"Lora,serif",color:"#2d3a2e",marginBottom:8,fontSize:24}}>Dans la tête de la maîtresse</h1>
          <p style={{color:"#7a8c7b",fontSize:14}}>Accès protégé</p>
        </div>
        <div style={{background:"#fff",borderRadius:16,border:"1px solid #d6e4d7",padding:"28px 32px",boxShadow:"0 4px 20px rgba(122,158,126,0.1)"}}>
          <label style={{fontSize:13,color:"#7a8c7b",fontWeight:600,display:"block",marginBottom:8}}>Mot de passe</label>
          <input
            type="password" value={pwd} onChange={e=>setPwd(e.target.value)}
            onKeyDown={e=>e.key==="Enter"&&login()}
            placeholder="••••••••"
            style={{width:"100%",border:"1.5px solid #d6e4d7",borderRadius:10,padding:"11px 14px",fontFamily:"inherit",fontSize:15,color:"#2d3a2e",background:"#faf8f3",outline:"none",boxSizing:"border-box",marginBottom:16}}
            autoFocus
          />

          <button onClick={login} disabled={loading||!pwd} style={{width:"100%",background:"#7a9e7e",color:"#fff",border:"none",borderRadius:10,padding:"12px",fontFamily:"inherit",fontSize:15,fontWeight:700,cursor:loading||!pwd?"not-allowed":"pointer",opacity:loading||!pwd?.6:1,transition:"opacity .2s"}}>
            {loading?"Vérification…":"→ Entrer"}
          </button>
          <p style={{fontSize:11,color:"#b5cdb8",textAlign:"center",marginTop:14}}>Mot de passe par défaut : <strong>Florence2024</strong><br/>À changer dans ⚙️ Paramètres</p>
        </div>
      </div>
    </div>
  );
}

/* ════════════════════════════════════════════════════
   APP PRINCIPALE
════════════════════════════════════════════════════ */
function App(){
  const [auth,setAuth]=useState(()=>sessionStorage.getItem("maitresse_auth")==="1");
  const [loading,setLoading]=useState(true);
  const [globalData,setGlobalData]=useState({});
  const [section,setSection]=useState("dashboard");
  const [sideOpen,setSideOpen]=useState(true);
  const [syncStatus,setSyncStatus]=useState("ok"); // "ok"|"saving"|"error"

  /* Chargement initial depuis JSONBin */
  useEffect(()=>{
    if(!auth){setLoading(false);return;}
    loadData().then(d=>{setGlobalData(d);setLoading(false);});
  },[auth]);

  /* Indicateur de sync */
  const wrappedSave=(data)=>{
    setSyncStatus("saving");
    setGlobalData(data);
    if(_saveTimeout)clearTimeout(_saveTimeout);
    _saveTimeout=setTimeout(async()=>{
      try{await saveData(data);setSyncStatus("ok");}
      catch{setSyncStatus("error");}
    },1200);
  };

  const mk=(key,def)=>{
    const val=globalData?.[key]??def;
    const set=useCallback(v=>wrappedSave({...globalData,[key]:v}),[key,globalData]);
    return [val,set];
  };

  if(!auth) return <LoginScreen onLogin={()=>{setAuth(true);setLoading(true);loadData().then(d=>{setGlobalData(d);setLoading(false);});}}/>;
  if(loading) return <LoadingScreen/>;

  const [apiKey,setApiKey]=mk("apikey","");
  const [config,setConfig]=mk("config",{prenom:"",niveau:"",ecole:"",nbEleves:"",infos:"",matieres:MATIERES_DEF});
  const [progressions,setProgressions]=mk("progressions",{});
  const [emploi,setEmploi]=mk("emploi",{});
  const [creneaux,setCreneaux]=mk("creneaux",CRENEAUX_DEF);
  const [eleves,setEleves]=mk("eleves",[]);
  const [evaluations,setEvaluations]=mk("evaluations",[]);
  const [resultats,setResultats]=mk("resultats",{});
  const [taches,setTaches]=mk("taches",[]);
  const [agenda,setAgenda]=mk("agenda",[]);
  const [journal,setJournal]=mk("journal",[]);

  const render=()=>{
    const p={config,apiKey};
    switch(section){
      case "dashboard":   return <Dashboard {...p} taches={taches} eleves={eleves} setEleves={setEleves} evaluations={evaluations} agenda={agenda} journal={journal} setJournal={setJournal} setSection={setSection}/>;
      case "progressions":return <Progressions {...p} progressions={progressions} setProgressions={setProgressions}/>;
      case "cahier":      return <Cahier {...p} progressions={progressions}/>;
      case "emploi":      return <Emploi {...p} emploi={emploi} setEmploi={setEmploi} progressions={progressions} creneaux={creneaux} setCreneaux={setCreneaux}/>;
      case "eleves":      return <Eleves eleves={eleves} setEleves={setEleves} apiKey={apiKey} journal={journal}/>;
      case "evaluations": return <Evaluations {...p} evaluations={evaluations} setEvaluations={setEvaluations}/>;
      case "resultats":   return <ResultatsEval eleves={eleves} evaluations={evaluations} resultats={resultats} setResultats={setResultats}/>;
      case "taches":      return <Taches taches={taches} setTaches={setTaches}/>;
      case "agenda":      return <Agenda agenda={agenda} setAgenda={setAgenda} emploi={emploi} creneaux={creneaux} progressions={progressions} config={config}/>;
      case "parametres":  return <Parametres config={config} setConfig={setConfig} apiKey={apiKey} setApiKey={setApiKey}/>;
      default: return null;
    }
  };

  return(
    <div style={{display:"flex",height:"100vh",fontFamily:"'DM Sans',sans-serif",background:C.cream,overflow:"hidden"}}>
      {/* Sidebar */}
      <div style={{width:sideOpen?220:56,transition:"width .25s",background:C.ink,display:"flex",flexDirection:"column",flexShrink:0,overflow:"hidden"}}>
        <div style={{padding:"18px 12px 14px",borderBottom:"1px solid rgba(255,255,255,0.08)"}}>
          <div style={{display:"flex",alignItems:"center",gap:10}}>
            <span style={{fontSize:22,flexShrink:0}}>🍎</span>
            {sideOpen&&<div style={{overflow:"hidden"}}>
              <div style={{color:C.white,fontWeight:700,fontSize:13,fontFamily:"Lora,serif",lineHeight:1.2,whiteSpace:"nowrap"}}>Dans la tête</div>
              <div style={{color:C.sageLight,fontSize:11,whiteSpace:"nowrap"}}>de la maîtresse</div>
            </div>}
            <button onClick={()=>setSideOpen(!sideOpen)} style={{marginLeft:"auto",border:"none",background:"none",color:"rgba(255,255,255,0.4)",cursor:"pointer",fontSize:12,flexShrink:0,padding:"2px 4px"}}>{sideOpen?"◀":"▶"}</button>
          </div>
        </div>
        <nav style={{flex:1,padding:"10px 6px",overflowY:"auto"}}>
          {SECTIONS.map(s=>(
            <button key={s.id} onClick={()=>setSection(s.id)} style={{display:"flex",alignItems:"center",gap:10,width:"100%",padding:"9px 10px",borderRadius:10,border:"none",cursor:"pointer",fontFamily:"inherit",background:section===s.id?"rgba(122,158,126,0.28)":"transparent",color:section===s.id?C.sageLight:"rgba(255,255,255,0.58)",fontSize:13,fontWeight:section===s.id?700:400,textAlign:"left",marginBottom:2,transition:"all .15s",whiteSpace:"nowrap",overflow:"hidden"}}>
              <span style={{fontSize:15,flexShrink:0}}>{s.icon}</span>
              {sideOpen&&s.label}
            </button>
          ))}
        </nav>
        {sideOpen&&(
          <div style={{padding:"10px 14px",borderTop:"1px solid rgba(255,255,255,0.08)"}}>
            {/* Indicateur sync */}
            <div style={{fontSize:10,marginBottom:6,display:"flex",alignItems:"center",gap:4,color:syncStatus==="ok"?"#81c784":syncStatus==="saving"?"#fcd34d":"#f87171"}}>
              {syncStatus==="ok"?"☁️ Synchronisé":syncStatus==="saving"?"⏳ Sauvegarde…":"⚠️ Erreur sync"}
            </div>
            {apiKey
              ?<div style={{fontSize:11,color:C.sageLight,display:"flex",alignItems:"center",gap:6}}>✨ IA activée <button onClick={()=>{if(confirm("Désactiver ?"))setApiKey("");}} style={{border:"none",background:"none",color:"rgba(255,255,255,0.3)",cursor:"pointer",fontSize:10,fontFamily:"inherit"}}>retirer</button></div>
              :<button onClick={()=>setSection("parametres")} style={{border:"none",background:"none",color:"rgba(255,255,255,0.35)",cursor:"pointer",fontSize:11,fontFamily:"inherit",textDecoration:"underline"}}>+ Ajouter clé IA</button>
            }
            <button onClick={()=>{if(confirm("Se déconnecter ?")){sessionStorage.removeItem("maitresse_auth");window.location.reload();}}} style={{border:"none",background:"none",color:"rgba(255,255,255,0.25)",cursor:"pointer",fontSize:10,fontFamily:"inherit",marginTop:8,display:"block"}}>
              → Déconnexion
            </button>
          </div>
        )}
      </div>

      {/* Main */}
      <main style={{flex:1,overflowY:"auto",padding:"32px 36px"}}>
        {!config.prenom&&section!=="parametres"&&(
          <div style={{background:"#fff9e6",border:"1px solid #f0c94a",borderRadius:12,padding:"12px 18px",marginBottom:24,display:"flex",alignItems:"center",gap:12}}>
            <span>👋</span>
            <p style={{margin:0,fontSize:14,color:"#7a5c00"}}>Commence par renseigner <strong>ta classe</strong> pour personnaliser l'outil. <button onClick={()=>setSection("parametres")} style={{border:"none",background:"none",color:C.terra,cursor:"pointer",fontWeight:700,fontSize:14,fontFamily:"inherit"}}>→ Paramètres</button></p>
          </div>
        )}
        {render()}
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
function EditInline({value,onChange,multi=false,style={}}){
  const [editing,setEditing]=useState(false);
  const [draft,setDraft]=useState(value);
  const ref=useRef(null);
  useEffect(()=>{if(editing&&ref.current){ref.current.focus();if(ref.current.select)ref.current.select();}},[editing]);
  const commit=()=>{onChange(draft.trim()||value);setEditing(false);};
  const cancel=()=>{setDraft(value);setEditing(false);};
  if(editing){
    const s={fontFamily:"inherit",fontSize:"inherit",color:C.ink,background:C.cream,border:`1.5px solid ${C.sage}`,borderRadius:8,padding:"4px 8px",outline:"none",width:"100%",resize:multi?"vertical":"none",...style};
    return multi
      ?<textarea ref={ref} value={draft} onChange={e=>setDraft(e.target.value)} onBlur={commit} onKeyDown={e=>{if(e.key==="Escape")cancel();}} rows={3} style={s}/>
      :<input ref={ref} value={draft} onChange={e=>setDraft(e.target.value)} onBlur={commit} onKeyDown={e=>{if(e.key==="Enter")commit();if(e.key==="Escape")cancel();}} style={s}/>;
  }
  return(
    <span onDoubleClick={()=>{setDraft(value);setEditing(true);}} title="Double-clic pour modifier"
      style={{cursor:"text",borderBottom:`1px dashed ${C.border}`,paddingBottom:1,...style}}>
      {value}
    </span>
  );
}

}

/* ── Picker heure à ±5min ── */
function parseHHMM(str){
  // "8h30" → {h:8,m:30}
  const m=str.replace("h",":").match(/^(\d{1,2}):(\d{2})$/);
  return m?{h:parseInt(m[1]),m:parseInt(m[2])}:{h:0,m:0};
}
function fmtHHMM({h,m}){return `${h}h${String(m).padStart(2,"0")}`;}
function addMin({h,m},delta){
  let total=h*60+m+delta;
  total=Math.max(0,Math.min(23*60+55,total));
  return {h:Math.floor(total/60),m:total%60};
}
function parseRange(str){
  // "8h30–9h30"
  const parts=str.split("–");
  return {start:parseHHMM(parts[0]||""),end:parseHHMM(parts[1]||"")};
}
function fmtRange({start,end}){return `${fmtHHMM(start)}–${fmtHHMM(end)}`;}

function TimeRangePicker({value,onChange}){
  const [open,setOpen]=useState(false);
  const [range,setRange]=useState(()=>parseRange(value));
  const ref=useRef(null);

  // Sync si value change de l'extérieur
  useEffect(()=>{setRange(parseRange(value));},[value]);

  // Fermer au clic extérieur
  useEffect(()=>{
    if(!open)return;
    const h=e=>{if(ref.current&&!ref.current.contains(e.target))setOpen(false);};
    document.addEventListener("mousedown",h);
    return()=>document.removeEventListener("mousedown",h);
  },[open]);

  const upd=(part,delta)=>{
    const next={...range,[part]:addMin(range[part],delta)};
    setRange(next);
    onChange(fmtRange(next));
  };

  const StepBtn=({onClick,children})=>(
    <button onClick={onClick} style={{border:`1px solid ${C.border}`,background:C.white,borderRadius:6,width:22,height:22,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",fontSize:12,color:C.ink,fontWeight:700,padding:0,lineHeight:1}}>
      {children}
    </button>
  );

  const TimeCol=({label,part})=>(
    <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:4}}>
      <span style={{fontSize:10,color:C.muted,fontWeight:700,textTransform:"uppercase",letterSpacing:"0.05em"}}>{label}</span>
      <StepBtn onClick={()=>upd(part,5)}>▲</StepBtn>
      <div style={{fontSize:15,fontWeight:700,color:C.ink,minWidth:40,textAlign:"center",padding:"2px 6px",background:C.cream,borderRadius:6,border:`1px solid ${C.border}`}}>
        {fmtHHMM(range[part])}
      </div>
      <StepBtn onClick={()=>upd(part,-5)}>▼</StepBtn>
    </div>
  );

  return(
    <div ref={ref} style={{position:"relative",display:"inline-block"}}>
      <button onClick={()=>setOpen(!open)} style={{
        border:"none",background:"none",cursor:"pointer",fontFamily:"inherit",
        fontSize:12,fontWeight:600,color:C.ink,padding:"4px 6px",borderRadius:6,
        borderBottom:`2px solid ${open?C.sage:C.border}`,transition:"border-color .15s",
        whiteSpace:"nowrap",
      }} title="Cliquer pour modifier le créneau">
        {value} ✎
      </button>
      {open&&(
        <div style={{
          position:"absolute",left:0,top:"calc(100% + 6px)",zIndex:100,
          background:C.white,border:`1.5px solid ${C.sage}`,borderRadius:14,
          padding:"14px 18px",boxShadow:"0 8px 24px rgba(0,0,0,0.12)",
          display:"flex",flexDirection:"column",gap:12,minWidth:180,
        }}>
          <p style={{fontSize:11,color:C.muted,margin:0,textAlign:"center",fontWeight:600}}>Modifier le créneau · ±5 min</p>
          <div style={{display:"flex",gap:14,alignItems:"center",justifyContent:"center"}}>
            <TimeCol label="Début" part="start"/>
            <span style={{fontSize:16,color:C.muted,marginTop:16}}>–</span>
            <TimeCol label="Fin" part="end"/>
          </div>
          <button onClick={()=>setOpen(false)} style={{border:"none",background:C.sage,color:C.white,borderRadius:8,padding:"6px",cursor:"pointer",fontFamily:"inherit",fontSize:12,fontWeight:600}}>
            ✓ Valider
          </button>
        </div>
      )}
    </div>
  );
}

/* ════════════════════════════════════════════════════
   PROGRESSIONS
════════════════════════════════════════════════════ */
function Progressions({config,progressions,setProgressions,apiKey}){
  const mats=config.matieres||MATIERES_DEF;
  const [sel,setSel]=useState(mats[0]);
  const [txt,setTxt]=useState("");
  const [gen,setGen]=useState(false);
  const items=progressions[sel]||[];

  const add=()=>{if(!txt.trim())return;setProgressions({...progressions,[sel]:[...items,{id:Date.now(),text:txt,done:false}]});setTxt("");};
  const toggle=id=>setProgressions({...progressions,[sel]:items.map(i=>i.id===id?{...i,done:!i.done}:i)});
  const remove=id=>setProgressions({...progressions,[sel]:items.filter(i=>i.id!==id)});

  const genIA=async()=>{
    if(!apiKey){alert("Ajoute une clé API dans ⚙️ Paramètres pour utiliser la génération IA.");return;}
    setGen(true);
    try{
      const t=await callIA(
        `Tu es enseignante en école primaire niveau ${config.niveau||"primaire"}. Génère une progression annuelle. Réponds UNIQUEMENT avec un tableau JSON valide [{text:"..."}]. Rien d'autre.`,
        `8 séquences clés pour ${sel} au niveau ${config.niveau||"CE2"}.`,
        apiKey
      );
      const clean=t.replace(/```json|```/g,"").trim();
      const parsed=JSON.parse(clean);
      setProgressions({...progressions,[sel]:[...items,...parsed.map(p=>({id:Date.now()+Math.random(),text:p.text,done:false}))]});
    }catch(e){alert("Erreur IA : "+e.message);}
    setGen(false);
  };

  return(
    <div style={{animation:"fadeIn .3s ease"}}>
      <h2 style={{fontFamily:"Lora,serif",marginBottom:20}}>📚 Progressions annuelles<IABadge apiKey={apiKey}/></h2>
      <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:16}}>
        {mats.map(m=><button key={m} onClick={()=>setSel(m)} style={{padding:"6px 14px",borderRadius:20,border:"none",cursor:"pointer",fontFamily:"inherit",fontSize:13,fontWeight:600,transition:"all .15s",background:sel===m?C.sage:C.sagePale,color:sel===m?C.white:C.sage}}>{m}</button>)}
      </div>
      <Card>
        <div style={{display:"flex",gap:10,marginBottom:16,alignItems:"center",flexWrap:"wrap"}}>
          <Inp value={txt} onChange={setTxt} placeholder={`Nouvelle séquence en ${sel}…`} style={{flex:1,minWidth:200}} onKD={e=>e.key==="Enter"&&add()}/>
          <Btn onClick={add} sm>+ Ajouter</Btn>
          <Btn onClick={genIA} v="gold" sm disabled={gen}>{gen?"…":"✨ Générer avec l'IA"}</Btn>
        </div>
        {gen&&<Spinner/>}
        {items.length===0&&!gen&&<p style={{color:C.muted,fontSize:14,fontStyle:"italic"}}>Aucune séquence. Ajoute-en ou génère avec l'IA !</p>}
        <div style={{display:"flex",flexDirection:"column",gap:8}}>
          {items.map(it=>(
            <div key={it.id} style={{display:"flex",alignItems:"center",gap:12,padding:"10px 14px",borderRadius:10,background:it.done?C.sagePale:C.warm,border:`1px solid ${it.done?C.sageLight:"#ecdfd4"}`}}>
              <input type="checkbox" checked={it.done} onChange={()=>toggle(it.id)} style={{accentColor:C.sage,width:16,height:16,cursor:"pointer"}}/>
              <span style={{flex:1,fontSize:14,color:it.done?C.muted:C.ink,textDecoration:it.done?"line-through":"none"}}>
                <EditInline value={it.text} onChange={v=>setProgressions({...progressions,[sel]:items.map(i=>i.id===it.id?{...i,text:v}:i)})}/>
              </span>
              <button onClick={()=>remove(it.id)} style={{border:"none",background:"none",cursor:"pointer",color:C.muted,fontSize:16}}>✕</button>
            </div>
          ))}
        </div>
        {items.length>0&&<p style={{marginTop:10,fontSize:13,color:C.muted}}>{items.filter(i=>i.done).length} / {items.length} séquences réalisées</p>}
      </Card>
    </div>
  );
}

/* ════════════════════════════════════════════════════
   CAHIER JOURNAL
════════════════════════════════════════════════════ */
function Cahier({config,progressions,apiKey}){
  const [jour,setJour]=useState("Lundi");
  const [date,setDate]=useState(()=>new Date().toISOString().split("T")[0]);
  const [seances,setSeances]=useState([]);
  const [genResult,setGenResult]=useState("");
  const [loading,setLoading]=useState(false);
  const mats=config.matieres||MATIERES_DEF;

  const addSeance=()=>setSeances([...seances,{id:Date.now(),matiere:mats[0],horaire:"",objectif:"",deroulement:"",materiel:"",diff:""}]);
  const updSeance=(id,field,val)=>setSeances(seances.map(s=>s.id===id?{...s,[field]:val}:s));
  const delSeance=id=>setSeances(seances.filter(s=>s.id!==id));

  const genIA=async()=>{
    if(!apiKey){alert("Ajoute une clé API dans ⚙️ Paramètres pour utiliser la génération IA.");return;}
    if(!seances.length){alert("Ajoute au moins une séance.");return;}
    setLoading(true);setGenResult("");
    try{
      const ctx=seances.map(s=>`- ${s.matiere}${s.horaire?" ("+s.horaire+")":""}: ${s.objectif||"objectif libre"}`).join("\n");
      const progs=seances.map(s=>{
        const p=(progressions[s.matiere]||[]).filter(x=>!x.done).map(x=>x.text).slice(0,2).join(", ");
        return p?`${s.matiere}: ${p}`:"";
      }).filter(Boolean).join("\n");
      const t=await callIA(
        `Tu es enseignante expérimentée en école primaire niveau ${config.niveau||"primaire"}. Rédige un cahier journal professionnel complet et prêt à l'emploi. Pour chaque séance : titre en majuscules, compétence/objectif précis, déroulement en 3 phases (lancement ~5min, activité principale avec durée, bilan ~5min), différenciation si pertinente, matériel. Sois concrète et pratique.`,
        `Cahier journal du ${jour} ${date}. Niveau ${config.niveau||"CE2"}. ${config.nbEleves?"Élèves : "+config.nbEleves+".":""} ${config.infos?"Infos : "+config.infos+".":" "}\nSéances :\n${ctx}\nProgressions en cours :\n${progs||"Non renseignées"}`,
        apiKey
      );
      setGenResult(t);
    }catch(e){setGenResult("Erreur IA : "+e.message);}
    setLoading(false);
  };

  const exportTxt=()=>{
    let txt=`CAHIER JOURNAL — ${jour.toUpperCase()} ${date}\n${"=".repeat(50)}\n\n`;
    if(genResult){txt+=genResult;}
    else{
      seances.forEach(s=>{
        txt+=`\n${s.matiere.toUpperCase()}${s.horaire?" — "+s.horaire:""}\n${"-".repeat(30)}\n`;
        if(s.objectif) txt+=`Objectif : ${s.objectif}\n`;
        if(s.deroulement) txt+=`Déroulement :\n${s.deroulement}\n`;
        if(s.materiel) txt+=`Matériel : ${s.materiel}\n`;
        if(s.diff) txt+=`Différenciation : ${s.diff}\n`;
        txt+="\n";
      });
    }
    const blob=new Blob([txt],{type:"text/plain"});
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);
    a.download=`cahier-journal-${jour}-${date}.txt`;a.click();
  };

  const printCahier=()=>{
    let content=genResult||seances.map(s=>`<h3>${s.matiere.toUpperCase()}${s.horaire?" — "+s.horaire:""}</h3>${s.objectif?`<p><strong>Objectif :</strong> ${s.objectif}</p>`:""}${s.deroulement?`<p><strong>Déroulement :</strong><br/>${s.deroulement.replace(/\n/g,"<br/>")}</p>`:""}${s.materiel?`<p><strong>Matériel :</strong> ${s.materiel}</p>`:""}${s.diff?`<p><strong>Différenciation :</strong> ${s.diff}</p>`:""}`).join("<hr/>");
    const w=window.open("","_blank");
    w.document.write(`<html><head><title>Cahier journal ${jour} ${date}</title><style>body{font-family:Georgia,serif;max-width:800px;margin:40px auto;line-height:1.8;font-size:14px}h1{color:#2d3a2e;border-bottom:2px solid #7a9e7e;padding-bottom:8px}h3{color:#7a9e7e;margin-top:24px}pre{white-space:pre-wrap;font-family:Georgia,serif}</style></head><body><h1>📓 Cahier journal — ${jour} ${date}</h1>${genResult?`<pre>${genResult}</pre>`:content}</body></html>`);
    w.document.close();w.print();
  };

  return(
    <div style={{animation:"fadeIn .3s ease"}}>
      <h2 style={{fontFamily:"Lora,serif",marginBottom:20}}>📓 Cahier journal<IABadge apiKey={apiKey}/></h2>

      {/* En-tête */}
      <Card style={{marginBottom:16}}>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:16}}>
          <div><Lbl>Jour</Lbl><Sel value={jour} onChange={setJour} options={JOURS.map(j=>({value:j,label:j}))} style={{width:"100%"}}/></div>
          <div><Lbl>Date</Lbl><input type="date" value={date} onChange={e=>setDate(e.target.value)} style={{width:"100%",border:`1.5px solid ${C.border}`,borderRadius:10,padding:"9px 14px",fontFamily:"inherit",fontSize:14,color:C.ink,background:C.cream,outline:"none",boxSizing:"border-box"}}/></div>
        </div>
      </Card>

      {/* Séances */}
      <div style={{display:"flex",flexDirection:"column",gap:12,marginBottom:16}}>
        {seances.map((s,idx)=>(
          <Card key={s.id} style={{borderLeft:`4px solid ${C.sage}`}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
              <span style={{fontWeight:700,color:C.sage,fontSize:14}}>Séance {idx+1}</span>
              <button onClick={()=>delSeance(s.id)} style={{border:"none",background:"none",cursor:"pointer",color:C.muted,fontSize:16}}>✕</button>
            </div>
            <div style={{display:"grid",gridTemplateColumns:"2fr 1fr",gap:12,marginBottom:12}}>
              <div><Lbl>Matière</Lbl><Sel value={s.matiere} onChange={v=>updSeance(s.id,"matiere",v)} options={mats.map(m=>({value:m,label:m}))} style={{width:"100%"}}/></div>
              <div><Lbl>Horaire</Lbl><Inp value={s.horaire} onChange={v=>updSeance(s.id,"horaire",v)} placeholder="ex: 9h00–10h00"/></div>
            </div>
            <div style={{marginBottom:12}}><Lbl>Objectif / Compétence</Lbl><Inp value={s.objectif} onChange={v=>updSeance(s.id,"objectif",v)} placeholder="ex: Lire et comprendre un texte narratif"/></div>
            <div style={{marginBottom:12}}><Lbl>Déroulement</Lbl><Inp value={s.deroulement} onChange={v=>updSeance(s.id,"deroulement",v)} placeholder="Phase 1 — Lancement (5 min) : …&#10;Phase 2 — Activité (30 min) : …&#10;Phase 3 — Bilan (5 min) : …" multi rows={5}/></div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
              <div><Lbl>Matériel</Lbl><Inp value={s.materiel} onChange={v=>updSeance(s.id,"materiel",v)} placeholder="ex: Manuel p.42, ardoises…"/></div>
              <div><Lbl>Différenciation</Lbl><Inp value={s.diff} onChange={v=>updSeance(s.id,"diff",v)} placeholder="ex: Fiche simplifiée groupe A"/></div>
            </div>
          </Card>
        ))}
      </div>

      <div style={{display:"flex",gap:10,flexWrap:"wrap",marginBottom:16}}>
        <Btn onClick={addSeance} v="secondary">+ Ajouter une séance</Btn>
        {apiKey&&<Btn onClick={genIA} v="gold" disabled={loading}>✨ Rédiger avec l'IA</Btn>}
        {seances.length>0&&<><Btn onClick={exportTxt} v="ghost" sm>⬇️ Exporter .txt</Btn><Btn onClick={printCahier} v="ghost" sm>🖨️ Imprimer</Btn></>}
      </div>
      {loading&&<Spinner/>}

      {/* Résultat IA */}
      {genResult&&(
        <Card style={{background:C.cream,borderLeft:`4px solid ${C.gold}`}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
            <h3 style={{margin:0,fontFamily:"Lora,serif"}}>✨ Cahier journal généré par l'IA</h3>
            <div style={{display:"flex",gap:8}}>
              <Btn sm v="secondary" onClick={()=>{navigator.clipboard?.writeText(genResult);alert("✅ Copié !");}}>📋 Copier</Btn>
              <Btn sm v="ghost" onClick={()=>setGenResult("")}>Fermer</Btn>
            </div>
          </div>
          <pre style={{whiteSpace:"pre-wrap",fontFamily:"inherit",fontSize:14,color:C.ink,lineHeight:1.8}}>{genResult}</pre>
        </Card>
      )}
    </div>
  );
}

/* ════════════════════════════════════════════════════
   EMPLOI DU TEMPS + DRAG & DROP PROGRESSIONS
════════════════════════════════════════════════════ */
function Emploi({config,emploi,setEmploi,progressions,creneaux,setCreneaux}){
  const mats=config.matieres||MATIERES_DEF;
  const [dragOver,setDragOver]=useState(null);
  const [matSel,setMatSel]=useState(mats[0]);
  const [showPanel,setShowPanel]=useState(true);

  const hues=[142,25,200,55,320,180,30,270,100,350];
  const MC={};mats.forEach((m,i)=>{MC[m]=`hsl(${hues[i%hues.length]},45%,88%)`;});

  const get=(j,s)=>emploi?.[j]?.[s];
  const getLabel=(j,s)=>{const v=get(j,s);return v?typeof v==="object"?v.matiere:v:"";}
  const getSeq=(j,s)=>{const v=get(j,s);return v&&typeof v==="object"?v.sequence:"";}
  const setCell=(j,s,val)=>setEmploi({...emploi,[j]:{...(emploi[j]||{}),[s]:val}});
  const clearCell=(j,s)=>setCell(j,s,"");
  const clear=()=>{if(confirm("Effacer tout l'emploi du temps ?"))setEmploi({});};
  const resetCreneaux=()=>{if(confirm("Remettre les créneaux par défaut ?"))setCreneaux(CRENEAUX_DEF);};

  const onDragStart=(e,matiere,sequence)=>{
    e.dataTransfer.setData("matiere",matiere);
    e.dataTransfer.setData("sequence",sequence||"");
    e.dataTransfer.effectAllowed="copy";
  };
  const onDragOver=(e,jour,slot)=>{e.preventDefault();e.dataTransfer.dropEffect="copy";setDragOver({jour,slot});};
  const onDrop=(e,jour,slot)=>{
    e.preventDefault();
    const matiere=e.dataTransfer.getData("matiere");
    const sequence=e.dataTransfer.getData("sequence");
    if(matiere) setCell(jour,slot,sequence?{matiere,sequence}:matiere);
    setDragOver(null);
  };

  const seqsMatiere=(progressions[matSel]||[]);
  const planifiees=new Set(
    Object.values(emploi||{}).flatMap(jour=>Object.values(jour).map(v=>typeof v==="object"?v.sequence:""))
  );

  const updCreneau=(i,val)=>{
    const next=[...creneaux];
    next[i]=val;
    setCreneaux(next);
  };

  return(
    <div style={{animation:"fadeIn .3s ease"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16,flexWrap:"wrap",gap:8}}>
        <h2 style={{fontFamily:"Lora,serif"}}>🕐 Emploi du temps</h2>
        <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
          <Btn sm v="ghost" onClick={resetCreneaux}>↺ Créneaux par défaut</Btn>
          <Btn sm v="secondary" onClick={()=>setShowPanel(!showPanel)}>
            {showPanel?"Masquer progressions ←":"→ Progressions"}
          </Btn>
          <Btn sm v="danger" onClick={clear}>🗑️ Effacer planning</Btn>
        </div>
      </div>

      <div style={{display:"grid",gridTemplateColumns:showPanel?"1fr 280px":"1fr",gap:16,alignItems:"start"}}>

        {/* ── Grille planning ── */}
        <Card style={{overflowX:"auto",padding:12}}>
          <table style={{width:"100%",borderCollapse:"collapse",minWidth:560}}>
            <thead><tr>
              <th style={{padding:"8px 10px",fontSize:12,color:C.muted,textAlign:"left",fontWeight:700,borderBottom:`2px solid ${C.border}`,whiteSpace:"nowrap"}}>Créneaux</th>
              {JOURS.map(j=><th key={j} style={{padding:"8px 10px",fontSize:13,color:C.ink,textAlign:"center",fontWeight:700,borderBottom:`2px solid ${C.border}`}}>{j}</th>)}
            </tr></thead>
            <tbody>
              {creneaux.map((slot,idx)=>(
                <tr key={idx}>
                  <td style={{padding:"6px 8px",fontSize:12,borderBottom:`1px solid ${C.border}`,whiteSpace:"nowrap",minWidth:140}}>
                    <TimeRangePicker value={slot} onChange={v=>updCreneau(idx,v)}/>
                  </td>
                  {JOURS.map(jour=>{
                    const matiere=getLabel(jour,slot);
                    const seq=getSeq(jour,slot);
                    const isOver=dragOver?.jour===jour&&dragOver?.slot===slot;
                    return(
                      <td key={jour} style={{padding:4,borderBottom:`1px solid ${C.border}`}}
                        onDragOver={e=>onDragOver(e,jour,slot)}
                        onDragLeave={()=>setDragOver(null)}
                        onDrop={e=>onDrop(e,jour,slot)}>
                        <div style={{
                          minHeight:52,padding:"5px 7px",borderRadius:9,
                          background:isOver?"#d4edda":matiere?MC[matiere]||C.sagePale:"transparent",
                          border:isOver?`2px dashed ${C.sage}`:`2px solid transparent`,
                          fontSize:11,fontWeight:600,color:C.ink,
                          display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",
                          cursor:matiere?"default":"pointer",
                          transition:"background .15s, border .15s",
                          position:"relative",
                        }}>
                          {matiere?(
                            <>
                              <span style={{fontWeight:700,fontSize:12}}>{matiere}</span>
                              {seq&&<span style={{fontSize:10,color:C.muted,marginTop:2,textAlign:"center",lineHeight:1.3}}>{seq.length>28?seq.slice(0,26)+"…":seq}</span>}
                              <button onClick={()=>clearCell(jour,slot)} style={{position:"absolute",top:2,right:3,border:"none",background:"none",cursor:"pointer",color:C.muted,fontSize:13,lineHeight:1,padding:0,opacity:.6}}>✕</button>
                            </>
                          ):(
                            <span style={{color:isOver?C.sage:C.border,fontSize:20}}>+</span>
                          )}
                        </div>
                      </td>
                    );
                  })}
                </tr>
              ))}
            </tbody>
          </table>
          <p style={{marginTop:10,fontSize:11,color:C.muted}}>Cliquer sur un créneau pour le modifier à ±5 min · Glisser une séquence dans une case · ✕ pour effacer.</p>
        </Card>

        {/* ── Panneau progressions ── */}
        {showPanel&&(
          <div style={{display:"flex",flexDirection:"column",gap:10}}>
            <Card style={{padding:"14px 16px"}}>
              <p style={{fontSize:12,fontWeight:700,color:C.muted,marginBottom:10,textTransform:"uppercase",letterSpacing:"0.05em"}}>Matière</p>
              <div style={{display:"flex",flexDirection:"column",gap:4}}>
                {mats.map(m=>(
                  <button key={m} onClick={()=>setMatSel(m)} style={{padding:"7px 12px",borderRadius:8,border:"none",cursor:"pointer",fontFamily:"inherit",fontSize:13,fontWeight:600,textAlign:"left",transition:"all .15s",background:matSel===m?C.sage:C.sagePale,color:matSel===m?C.white:C.sage}}>{m}</button>
                ))}
              </div>
            </Card>
            <Card style={{padding:"14px 16px"}}>
              <p style={{fontSize:12,fontWeight:700,color:C.muted,marginBottom:4,textTransform:"uppercase",letterSpacing:"0.05em"}}>Séquences — {matSel}</p>
              <p style={{fontSize:11,color:C.muted,marginBottom:10,fontStyle:"italic"}}>Glisse une carte vers le planning →</p>
              <div draggable onDragStart={e=>onDragStart(e,matSel,"")} style={{padding:"8px 12px",borderRadius:8,marginBottom:8,background:MC[matSel]||C.sagePale,border:`1px solid ${C.border}`,cursor:"grab",fontSize:12,fontWeight:700,color:C.ink,display:"flex",alignItems:"center",gap:6,userSelect:"none"}}>
                <span style={{fontSize:14}}>☰</span> {matSel} <span style={{fontSize:10,color:C.muted,fontWeight:400,marginLeft:"auto"}}>(matière seule)</span>
              </div>
              {seqsMatiere.length===0&&<p style={{fontSize:12,color:C.muted,fontStyle:"italic"}}>Aucune séquence. Ajoute-en dans Progressions.</p>}
              <div style={{display:"flex",flexDirection:"column",gap:6,maxHeight:380,overflowY:"auto"}}>
                {seqsMatiere.map(seq=>{
                  const dejaPlace=planifiees.has(seq.text);
                  return(
                    <div key={seq.id} draggable={!seq.done} onDragStart={e=>onDragStart(e,matSel,seq.text)}
                      style={{padding:"9px 12px",borderRadius:8,background:seq.done?"#f0f0f0":dejaPlace?"#e8f5e9":C.warm,border:`1px solid ${seq.done?"#ddd":dejaPlace?"#81c784":"#ecdfd4"}`,cursor:seq.done?"not-allowed":"grab",opacity:seq.done?.5:1,userSelect:"none"}}>
                      <div style={{display:"flex",alignItems:"flex-start",gap:6}}>
                        <span style={{fontSize:13,marginTop:1}}>{seq.done?"✅":dejaPlace?"📌":"⋮⋮"}</span>
                        <span style={{fontSize:12,color:C.ink,lineHeight:1.4,flex:1}}>{seq.text}</span>
                      </div>
                      {dejaPlace&&!seq.done&&<div style={{fontSize:10,color:"#2e7d32",marginTop:4,marginLeft:20,fontWeight:600}}>Déjà planifiée</div>}
                    </div>
                  );
                })}
              </div>
            </Card>
          </div>
        )}
      </div>
    </div>
  );
}

/* ════════════════════════════════════════════════════
   ÉLÈVES
════════════════════════════════════════════════════ */
function Eleves({eleves,setEleves,apiKey}){
  const [nom,setNom]=useState("");
  const [sel,setSel]=useState(null);
  const [note,setNote]=useState("");
  const [gen,setGen]=useState(false);

  const add=()=>{if(!nom.trim())return;setEleves([...eleves,{id:Date.now(),nom:nom.trim(),notes:[],apc:false,tag:""}]);setNom("");};
  const addNote=id=>{if(!note.trim())return;setEleves(eleves.map(e=>e.id===id?{...e,notes:[...e.notes,{date:new Date().toLocaleDateString("fr-FR"),text:note}]}:e));setNote("");};
  const toggleApc=id=>setEleves(eleves.map(e=>e.id===id?{...e,apc:!e.apc}:e));
  const setTag=(id,tag)=>setEleves(eleves.map(e=>e.id===id?{...e,tag}:e));
  const delNote=(eid,ni)=>setEleves(eleves.map(e=>e.id===eid?{...e,notes:e.notes.filter((_,i)=>i!==ni)}:e));
  const del=id=>{if(!confirm("Supprimer cet élève ?"))return;setEleves(eleves.filter(e=>e.id!==id));if(sel===id)setSel(null);};

  const bilan=async eleve=>{
    if(!apiKey){alert("Ajoute une clé API dans ⚙️ Paramètres pour utiliser la génération IA.");return;}
    setGen(true);
    try{
      const n=eleve.notes.map(x=>`${x.date}: ${x.text}`).join("\n")||"Aucune observation";
      const t=await callIA("Tu es enseignante en école primaire. Rédige un bilan bref et bienveillant (4-5 phrases) pour une communication parent ou un bulletin, basé sur les observations de l'enseignante. Ton chaleureux, constructif, précis.)",
        `Élève : ${eleve.nom}. APC : ${eleve.apc?"oui":"non"}. Groupe : ${eleve.tag||"standard"}.\nObservations :\n${n}`,apiKey);
      const w=window.open("","_blank");
      w.document.write(`<html><head><title>Bilan ${eleve.nom}</title><style>body{font-family:Georgia,serif;max-width:600px;margin:60px auto;line-height:1.8;font-size:15px}h2{color:#7a9e7e}</style></head><body><h2>Bilan — ${eleve.nom}</h2><p>${t.replace(/\n/g,"<br/>")}</p></body></html>`);
      w.document.close();
    }catch(e){alert("Erreur IA : "+e.message);}
    setGen(false);
  };

  const TAGS=["","Groupe A","Groupe B","Groupe C","PAP","DYS","EIP"];
  const e=eleves.find(x=>x.id===sel);
  const apcCount=eleves.filter(e=>e.apc).length;

  return(
    <div style={{animation:"fadeIn .3s ease"}}>
      <h2 style={{fontFamily:"Lora,serif",marginBottom:20}}>👧 Suivi élèves<IABadge apiKey={apiKey}/></h2>
      {apcCount>0&&<div style={{background:"#fff9e6",border:"1px solid #f0c94a",borderRadius:10,padding:"8px 16px",marginBottom:16,fontSize:13,color:"#7a5c00"}}>🎯 {apcCount} élève{apcCount>1?"s":""} en APC</div>}
      <div style={{display:"grid",gridTemplateColumns:"260px 1fr",gap:16}}>
        {/* Liste */}
        <div>
          <Card style={{marginBottom:10}}>
            <div style={{display:"flex",gap:8}}>
              <Inp value={nom} onChange={setNom} placeholder="Prénom élève" onKD={e=>e.key==="Enter"&&add()}/>
              <Btn onClick={add} sm>+</Btn>
            </div>
          </Card>
          <Card style={{padding:"8px 10px",maxHeight:460,overflowY:"auto"}}>
            {eleves.length===0&&<p style={{color:C.muted,fontSize:13,fontStyle:"italic",padding:"8px 4px"}}>Aucun élève ajouté.</p>}
            {eleves.map(e=>(
              <div key={e.id} onClick={()=>setSel(e.id)} style={{padding:"9px 10px",borderRadius:10,cursor:"pointer",marginBottom:3,background:sel===e.id?C.sagePale:"transparent",display:"flex",justifyContent:"space-between",alignItems:"center",border:`1px solid ${sel===e.id?C.sageLight:"transparent"}`,transition:"all .15s"}}>
                <span style={{fontSize:14,fontWeight:600,color:C.ink}}>{e.nom}</span>
                <div style={{display:"flex",gap:4,alignItems:"center"}}>
                  {e.apc&&<Badge label="APC" bg="#fff3cd" tc="#856404"/>}
                  {e.tag&&<Badge label={e.tag} bg={C.sagePale} tc={C.sage}/>}
                  <span style={{fontSize:11,color:C.muted}}>{e.notes.length}📝</span>
                </div>
              </div>
            ))}
          </Card>
        </div>
        {/* Fiche */}
        <div>
          {!e?<Card style={{textAlign:"center",padding:48}}><p style={{color:C.muted}}>← Sélectionne un élève</p></Card>:(
            <Card>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16,flexWrap:"wrap",gap:8}}>
                <h3 style={{margin:0,fontFamily:"Lora,serif"}}>
                  <EditInline value={e.nom} onChange={v=>setEleves(eleves.map(el=>el.id===e.id?{...el,nom:v}:el))} style={{fontSize:18,fontWeight:700}}/>
                </h3>
                <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
                  <Sel value={e.tag||""} onChange={v=>setTag(e.id,v)} options={TAGS.map(t=>({value:t,label:t||"Groupe —"}))} style={{fontSize:12,padding:"5px 10px"}}/>
                  <Btn sm v={e.apc?"secondary":"ghost"} onClick={()=>toggleApc(e.id)}>{e.apc?"✅ APC actif":"Marquer APC"}</Btn>
                  {apiKey&&<Btn sm v="gold" onClick={()=>bilan(e)} disabled={gen}>✨ Bilan IA</Btn>}
                  <Btn sm v="danger" onClick={()=>del(e.id)}>Suppr.</Btn>
                </div>
              </div>
              <div style={{display:"flex",gap:10,marginBottom:16}}>
                <Inp value={note} onChange={setNote} placeholder="Ajouter une observation…" style={{flex:1}} onKD={ev=>ev.key==="Enter"&&addNote(e.id)}/>
                <Btn sm onClick={()=>addNote(e.id)}>+ Note</Btn>
              </div>
              {gen&&<Spinner/>}
              <div style={{display:"flex",flexDirection:"column",gap:8,maxHeight:340,overflowY:"auto"}}>
                {e.notes.length===0&&<p style={{color:C.muted,fontSize:13,fontStyle:"italic"}}>Aucune note pour cet élève.</p>}
                {[...e.notes].map((n,i)=>{
                  const realIdx=e.notes.length-1-i;
                  const updNote=(field,val)=>setEleves(eleves.map(el=>el.id===e.id?{...el,notes:el.notes.map((nn,ni)=>ni===realIdx?{...nn,[field]:val}:nn)}:el));
                  return(
                    <div key={i} style={{padding:"10px 14px",borderRadius:10,background:n.fromJournal?"#f0f7ff":C.warm,border:`1px solid ${n.fromJournal?"#bee3f8":"#ecdfd4"}`,display:"flex",gap:10,alignItems:"flex-start"}}>
                      <div style={{flex:1}}>
                        <EditDate value={n.date} onChange={v=>updNote("date",v)}/>
                        {n.fromJournal&&<span style={{fontSize:10,color:"#3182ce",fontWeight:700,marginLeft:8}}>📋 Journal</span>}
                        <p style={{margin:"4px 0 0",fontSize:14,color:C.ink}}>
                          <EditInline value={n.text} onChange={v=>updNote("text",v)} multi/>
                        </p>
                      </div>
                      <button onClick={()=>delNote(e.id,realIdx)} style={{border:"none",background:"none",cursor:"pointer",color:C.muted,fontSize:14,flexShrink:0}}>✕</button>
                    </div>
                  );
                })}
              </div>
            </Card>
          )}
        </div>
      </div>
    </div>
  );
}

/* ════════════════════════════════════════════════════
   ÉVALUATIONS
════════════════════════════════════════════════════ */
function Evaluations({config,evaluations,setEvaluations,apiKey}){
  const mats=config.matieres||MATIERES_DEF;
  const [form,setForm]=useState({matiere:mats[0],titre:"",date:new Date().toISOString().split("T")[0],competence:"",statut:"Prévue"});
  const [gen,setGen]=useState(false);
  const [result,setResult]=useState("");
  const STATUTS=["Prévue","En cours","Corrigée","Archivée"];
  const SC={"Prévue":C.sagePale,"En cours":"#fff3cd","Corrigée":"#d4edda","Archivée":"#e8e8e8"};

  const add=()=>{if(!form.titre.trim())return;setEvaluations([{id:Date.now(),...form},...evaluations]);setForm({matiere:mats[0],titre:"",date:new Date().toISOString().split("T")[0],competence:"",statut:"Prévue"});};
  const updStatut=(id,s)=>setEvaluations(evaluations.map(e=>e.id===id?{...e,statut:s}:e));
  const del=id=>setEvaluations(evaluations.filter(e=>e.id!==id));

  const genEval=async()=>{
    if(!apiKey){alert("Ajoute une clé API dans ⚙️ Paramètres pour utiliser la génération IA.");return;}
    setGen(true);setResult("");
    try{
      const t=await callIA(
        `Tu es enseignante en école primaire niveau ${config.niveau||"CE2"}. Génère une évaluation complète, prête à imprimer et distribuer aux élèves : titre, compétences évaluées, 5-7 exercices variés avec consignes claires, barème indicatif. Format propre et lisible.`,
        `Matière : ${form.matiere}. Titre : ${form.titre||"évaluation de séquence"}. Compétence : ${form.competence||"à définir"}. Niveau : ${config.niveau||"CE2"}.`,
        apiKey
      );
      setResult(t);
    }catch(e){setResult("Erreur IA : "+e.message);}
    setGen(false);
  };

  return(
    <div style={{animation:"fadeIn .3s ease"}}>
      <h2 style={{fontFamily:"Lora,serif",marginBottom:20}}>✅ Évaluations<IABadge apiKey={apiKey}/></h2>
      <Card style={{marginBottom:16}}>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr 1fr",gap:12,marginBottom:12}}>
          <div><Lbl>Matière</Lbl><Sel value={form.matiere} onChange={v=>setForm({...form,matiere:v})} options={mats.map(m=>({value:m,label:m}))} style={{width:"100%"}}/></div>
          <div><Lbl>Titre</Lbl><Inp value={form.titre} onChange={v=>setForm({...form,titre:v})} placeholder="ex: Nombres décimaux"/></div>
          <div><Lbl>Date</Lbl><input type="date" value={form.date} onChange={e=>setForm({...form,date:e.target.value})} style={{width:"100%",border:`1.5px solid ${C.border}`,borderRadius:10,padding:"9px 14px",fontFamily:"inherit",fontSize:14,color:C.ink,background:C.cream,outline:"none",boxSizing:"border-box"}}/></div>
          <div><Lbl>Statut</Lbl><Sel value={form.statut} onChange={v=>setForm({...form,statut:v})} options={STATUTS.map(s=>({value:s,label:s}))} style={{width:"100%"}}/></div>
          <div style={{gridColumn:"1/-1"}}><Lbl>Compétence ciblée</Lbl><Inp value={form.competence} onChange={v=>setForm({...form,competence:v})} placeholder="ex: Lire et écrire les nombres jusqu'à 999"/></div>
        </div>
        <div style={{display:"flex",gap:10}}>
          <Btn onClick={add} sm>+ Enregistrer</Btn>
          {apiKey&&<Btn onClick={genEval} v="gold" sm disabled={gen}>✨ Générer l'évaluation</Btn>}
        </div>
      </Card>

      {(gen||result)&&(
        <Card style={{background:C.cream,borderLeft:`4px solid ${C.gold}`,marginBottom:16}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
            <h3 style={{margin:0,fontFamily:"Lora,serif"}}>✨ Évaluation générée</h3>
            {result&&<div style={{display:"flex",gap:8}}>
              <Btn sm v="secondary" onClick={()=>{navigator.clipboard?.writeText(result);alert("✅ Copié !");}}>📋 Copier</Btn>
              <Btn sm v="ghost" onClick={()=>setResult("")}>Fermer</Btn>
            </div>}
          </div>
          {gen?<Spinner/>:<pre style={{whiteSpace:"pre-wrap",fontFamily:"inherit",fontSize:14,color:C.ink,lineHeight:1.7}}>{result}</pre>}
        </Card>
      )}

      <div style={{display:"flex",flexDirection:"column",gap:8}}>
        {evaluations.length===0&&<p style={{color:C.muted,fontSize:14,fontStyle:"italic"}}>Aucune évaluation enregistrée.</p>}
        {evaluations.map(ev=>{
          const upd=(field,val)=>setEvaluations(evaluations.map(e=>e.id===ev.id?{...e,[field]:val}:e));
          return(
            <Card key={ev.id} style={{padding:"14px 16px"}}>
              <div style={{display:"flex",alignItems:"flex-start",gap:12,flexWrap:"wrap"}}>
                <Badge label={ev.matiere}/>
                <div style={{flex:1,minWidth:120}}>
                  <div style={{fontWeight:700,fontSize:14,color:C.ink,marginBottom:4}}>
                    <EditInline value={ev.titre} onChange={v=>upd("titre",v)}/>
                  </div>
                  {ev.competence&&<div style={{fontSize:12,color:C.muted}}>
                    <EditInline value={ev.competence} onChange={v=>upd("competence",v)} style={{fontSize:12,color:C.muted}}/>
                  </div>}
                </div>
                <EditDate value={ev.date} onChange={v=>upd("date",v)}/>
                <Sel value={ev.statut} onChange={v=>upd("statut",v)} options={STATUTS.map(s=>({value:s,label:s}))} style={{padding:"4px 10px",fontSize:12,background:SC[ev.statut]||C.sagePale,borderColor:"transparent"}}/>
                <button onClick={()=>del(ev.id)} style={{border:"none",background:"none",cursor:"pointer",color:C.muted}}>✕</button>
              </div>
            </Card>
          );
        })}
      </div>
    </div>
  );
}

/* ════════════════════════════════════════════════════
   RÉSULTATS DES ÉVALUATIONS — grille élèves × items
════════════════════════════════════════════════════ */

/* Niveaux disponibles : A / B / C / D + non évalué */
const NIVEAUX=[
  {code:"",label:"—",bg:"#f0f0f0",tc:"#aaa"},
  {code:"A",label:"A",bg:"#d4edda",tc:"#155724"},
  {code:"B",label:"B",bg:"#d1ecf1",tc:"#0c5460"},
  {code:"C",label:"C",bg:"#fff3cd",tc:"#856404"},
  {code:"D",label:"D",bg:"#fde8e8",tc:"#721c24"},
  {code:"ABS",label:"ABS",bg:"#e8e8e8",tc:"#555"},
];
const NIV_MAP=Object.fromEntries(NIVEAUX.map(n=>[n.code,n]));

function ResultatsEval({eleves,evaluations,resultats,setResultats}){
  /* resultats[evalId][eleveId][itemIdx] = "A"|"B"|"C"|"D"|"ABS"|"" */

  const [evalSel,setEvalSel]=useState(null);
  const [showAddEval,setShowAddEval]=useState(false);
  const [editItems,setEditItems]=useState(false);

  // Sélectionner auto la première éval si aucune
  useEffect(()=>{
    if(!evalSel&&evaluations.length>0) setEvalSel(evaluations[0].id);
  },[evaluations]);

  const ev=evaluations.find(e=>e.id===evalSel);

  /* Items (compétences/exercices) de cette éval */
  const getItems=id=>(resultats[id]?.__items)||[];
  const setItems=(id,items)=>setResultats({...resultats,[id]:{...(resultats[id]||{}),__items:items}});

  const [newItem,setNewItem]=useState("");
  const addItem=()=>{
    if(!ev||!newItem.trim())return;
    setItems(ev.id,[...getItems(ev.id),{id:Date.now(),label:newItem.trim()}]);
    setNewItem("");
  };
  const removeItem=(evalId,itemId)=>setItems(evalId,getItems(evalId).filter(i=>i.id!==itemId));
  const renameItem=(evalId,itemId,label)=>setItems(evalId,getItems(evalId).map(i=>i.id===itemId?{...i,label}:i));

  /* Résultat d'un élève pour un item */
  const getRes=(evalId,eleveId,itemId)=>resultats?.[evalId]?.[eleveId]?.[itemId]||"";
  const setRes=(evalId,eleveId,itemId,val)=>setResultats({
    ...resultats,
    [evalId]:{...(resultats[evalId]||{}),
      [eleveId]:{...(resultats[evalId]?.[eleveId]||{}),[itemId]:val}
    }
  });

  /* Cycle niveau au clic : ""→A→B→C→D→ABS→"" */
  const ORDER=["","A","B","C","D","ABS"];
  const cycleRes=(evalId,eleveId,itemId)=>{
    const cur=getRes(evalId,eleveId,itemId);
    const idx=ORDER.indexOf(cur);
    const next=ORDER[(idx+1)%ORDER.length];
    setRes(evalId,eleveId,itemId,next);
  };

  /* Stats par item */
  const statsItem=(evalId,itemId)=>{
    const counts={A:0,B:0,C:0,D:0,ABS:0,total:0};
    eleves.forEach(el=>{
      const v=getRes(evalId,el.id,itemId);
      if(v){counts[v]=(counts[v]||0)+1;counts.total++;}
    });
    return counts;
  };

  /* Stats globales par élève */
  const statsEleve=(evalId,eleveId)=>{
    const items=getItems(evalId);
    const counts={A:0,B:0,C:0,D:0,ABS:0};
    items.forEach(it=>{const v=getRes(evalId,eleveId,it.id);if(v)counts[v]=(counts[v]||0)+1;});
    return counts;
  };

  /* Export CSV */
  const exportCSV=()=>{
    if(!ev)return;
    const items=getItems(ev.id);
    const header=["Élève",...items.map(i=>i.label),"Nb A","Nb B","Nb C","Nb D"].join(";");
    const rows=eleves.map(el=>{
      const vals=items.map(it=>getRes(ev.id,el.id,it.id)||"");
      const s=statsEleve(ev.id,el.id);
      return [el.nom,...vals,s.A,s.B,s.C,s.D].join(";");
    });
    const csv=[header,...rows].join("\n");
    const blob=new Blob(["\ufeff"+csv],{type:"text/csv;charset=utf-8"});
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);
    a.download=`resultats-${ev.titre||"eval"}.csv`;a.click();
  };

  /* Remplissage rapide colonne */
  const fillColonne=(evalId,itemId,val)=>{
    const copy={...resultats,[evalId]:{...(resultats[evalId]||{})}};
    eleves.forEach(el=>{ copy[evalId][el.id]={...(copy[evalId][el.id]||{}),[itemId]:val}; });
    setResultats(copy);
  };

  const items=ev?getItems(ev.id):[];

  return(
    <div style={{animation:"fadeIn .3s ease"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16,flexWrap:"wrap",gap:8}}>
        <h2 style={{fontFamily:"Lora,serif"}}>📊 Résultats des évaluations</h2>
        {ev&&<div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
          <Btn sm v={editItems?"primary":"secondary"} onClick={()=>setEditItems(!editItems)}>
            {editItems?"✓ Fermer items":"✏️ Gérer les items"}
          </Btn>
          <Btn sm v="ghost" onClick={exportCSV}>⬇️ Export CSV</Btn>
        </div>}
      </div>

      {evaluations.length===0&&(
        <Card style={{textAlign:"center",padding:40}}>
          <p style={{color:C.muted,fontSize:14}}>Crée d'abord des évaluations dans la section ✅ Évaluations.</p>
        </Card>
      )}

      {evaluations.length>0&&(
        <>

                                <button key={n} onClick={()=>fillColonne(ev.id,it.id,n)} title={`Mettre ${n} pour tous`}

                              <div style={{display:"flex",flexDirection:"column",gap:1,alignItems:"center"}}>

                  <div style={{display:"flex",gap:16,marginTop:12,flexWrap:"wrap",alignItems:"center"}}>
                    <p style={{fontSize:11,color:C.muted}}>Clic sur une case pour cycler : — → A → B → C → D → ABS → —</p>
                    <div style={{display:"flex",gap:6}}>
                      {NIVEAUX.filter(n=>n.code).map(n=>(

                      ))}
