                </Card>
              ):(
                <Card style={{textAlign:"center",padding:32}}>
                  <p style={{color:C.muted,fontSize:14}}>
                    {items.length===0?"Ajoute des items via ✏️ Gérer les items pour commencer la saisie.":"Ajoute des élèves dans la section 👧 Suivi élèves."}
                  </p>
                </Card>
              )}
            </>
          )}
        </>
      )}
    </div>
  );
}


function Taches({taches,setTaches}){
  const [txt,setTxt]=useState("");
  const [cat,setCat]=useState("Administratif");
  const [filtre,setFiltre]=useState("Toutes");
  const CATS=["Administratif","Pédagogique","APC","APE","Mairie","Personnel"];
  const CC={"Administratif":"#dbeafe","Pédagogique":C.sagePale,"APC":"#fce7f3","APE":"#fff3cd","Mairie":"#e2e8f0","Personnel":"#ede9fe"};

  const add=()=>{if(!txt.trim())return;setTaches([{id:Date.now(),text:txt,cat,done:false,date:new Date().toLocaleDateString("fr-FR")},...taches]);setTxt("");};
  const toggle=id=>setTaches(taches.map(t=>t.id===id?{...t,done:!t.done}:t));
  const del=id=>setTaches(taches.filter(t=>t.id!==id));

  const filtres=["Toutes",...CATS];
  const pending=taches.filter(t=>!t.done&&(filtre==="Toutes"||t.cat===filtre));
  const done=taches.filter(t=>t.done);

  return(
    <div style={{animation:"fadeIn .3s ease"}}>
      <h2 style={{fontFamily:"Lora,serif",marginBottom:20}}>📋 Tâches & TO DO</h2>
      <Card style={{marginBottom:16}}>
        <div style={{display:"flex",gap:10,flexWrap:"wrap"}}>
          <Inp value={txt} onChange={setTxt} placeholder="Nouvelle tâche…" style={{flex:1,minWidth:180}} onKD={e=>e.key==="Enter"&&add()}/>
          <Sel value={cat} onChange={setCat} options={CATS.map(c=>({value:c,label:c}))}/>
          <Btn onClick={add} sm>+ Ajouter</Btn>
        </div>
      </Card>

      {/* Filtres */}
      <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:14}}>
        {filtres.map(f=><button key={f} onClick={()=>setFiltre(f)} style={{padding:"4px 12px",borderRadius:20,border:"none",cursor:"pointer",fontFamily:"inherit",fontSize:12,fontWeight:600,background:filtre===f?C.ink:C.border,color:filtre===f?C.white:C.muted}}>{f}</button>)}
      </div>

      <div style={{display:"flex",flexDirection:"column",gap:8}}>
        {pending.length===0&&<p style={{color:C.muted,fontSize:14,fontStyle:"italic"}}>Aucune tâche en cours. Profite ! 🌿</p>}
        {pending.map(t=>(
          <div key={t.id} style={{display:"flex",alignItems:"center",gap:12,padding:"11px 16px",borderRadius:10,background:C.warm,border:"1px solid #ecdfd4"}}>
            <input type="checkbox" checked={false} onChange={()=>toggle(t.id)} style={{accentColor:C.sage,width:16,height:16,cursor:"pointer"}}/>
            <span style={{flex:1,fontSize:14,color:C.ink}}>
              <EditInline value={t.text} onChange={v=>setTaches(taches.map(x=>x.id===t.id?{...x,text:v}:x))}/>
            </span>
            <select value={t.cat} onChange={e=>setTaches(taches.map(x=>x.id===t.id?{...x,cat:e.target.value}:x))}
              style={{border:`1px solid ${C.border}`,borderRadius:8,padding:"3px 8px",fontFamily:"inherit",fontSize:12,background:CC[t.cat]||C.sagePale,color:C.ink,cursor:"pointer",outline:"none"}}>
              {CATS.map(c=><option key={c} value={c}>{c}</option>)}
            </select>
            <span style={{fontSize:11,color:C.muted,whiteSpace:"nowrap"}}>{t.date}</span>
            <button onClick={()=>del(t.id)} style={{border:"none",background:"none",cursor:"pointer",color:C.muted}}>✕</button>
          </div>
        ))}
        {done.length>0&&<>
          <div style={{display:"flex",alignItems:"center",gap:10,marginTop:8}}>
            <p style={{fontSize:12,color:C.muted,fontWeight:700}}>TERMINÉES ({done.length})</p>
            <button onClick={()=>setTaches(taches.filter(t=>!t.done))} style={{border:"none",background:"none",cursor:"pointer",color:C.terra,fontSize:12,fontFamily:"inherit",fontWeight:600}}>Tout supprimer</button>
          </div>
          {done.map(t=>(
            <div key={t.id} style={{display:"flex",alignItems:"center",gap:12,padding:"8px 16px",borderRadius:10,background:C.sagePale,opacity:.7}}>
              <input type="checkbox" checked={true} onChange={()=>toggle(t.id)} style={{accentColor:C.sage,width:16,height:16,cursor:"pointer"}}/>
              <span style={{flex:1,fontSize:13,color:C.muted,textDecoration:"line-through"}}>{t.text}</span>
              <button onClick={()=>del(t.id)} style={{border:"none",background:"none",cursor:"pointer",color:C.muted}}>✕</button>
            </div>
          ))}
        </>}
      </div>
    </div>
  );
}

/* ════════════════════════════════════════════════════
   AGENDA HEBDOMADAIRE
════════════════════════════════════════════════════ */

function lundiDe(date){
  const d=new Date(date);const day=d.getDay()||7;
  d.setDate(d.getDate()-day+1);d.setHours(0,0,0,0);return d;
}
function addDays(date,n){const d=new Date(date);d.setDate(d.getDate()+n);return d;}
function isoDate(d){return d.toISOString().split("T")[0];}
function labelJour(d){return d.toLocaleDateString("fr-FR",{weekday:"short",day:"numeric",month:"short"});}

/* Mini saisie heure */
function TimeInput({value,onChange,placeholder}){
  return <input type="time" value={value||""} onChange={e=>onChange(e.target.value)}
    style={{border:`1.5px solid ${C.border}`,borderRadius:8,padding:"7px 10px",fontFamily:"inherit",
      fontSize:13,color:C.ink,background:C.cream,outline:"none",width:"100%"}}/>;
}

function Agenda({agenda,setAgenda,emploi,creneaux,progressions,config}){
  const mats=config.matieres||MATIERES_DEF;
  const hues=[142,25,200,55,320,180,30,270,100,350];
  const MC={};mats.forEach((m,i)=>{MC[m]=`hsl(${hues[i%hues.length]},45%,88%)`;});
  const TYPES_EV=["Sortie scolaire","RDV parents","Conseil de maîtres","Réunion","Journée pédagogique","Autre"];
  const TC={"Sortie scolaire":"#fce7f3","RDV parents":"#dbeafe","Conseil de maîtres":"#ede9fe","Réunion":"#fff3cd","Journée pédagogique":"#fee2e2","Autre":"#e8e8e8"};
  const TC_BORDER={"Sortie scolaire":"#f9a8d4","RDV parents":"#93c5fd","Conseil de maîtres":"#c4b5fd","Réunion":"#fcd34d","Journée pédagogique":"#fca5a5","Autre":"#d1d5db"};

  /* ── Navigation semaine ── */
  const [lundi,setLundi]=useState(()=>lundiDe(new Date()));
  const semDates=Array.from({length:5},(_,i)=>addDays(lundi,i));
  const prevSem=()=>setLundi(d=>addDays(d,-7));
  const nextSem=()=>setLundi(d=>addDays(d,7));
  const today=isoDate(new Date());
  const labelSem=`Semaine du ${lundi.toLocaleDateString("fr-FR",{day:"numeric",month:"long"})} au ${isoDate(addDays(lundi,4)).split("-")[2]} ${addDays(lundi,4).toLocaleDateString("fr-FR",{month:"long",year:"numeric"})}`;

  /* ── Mini-calendrier mensuel ── */
  const [calMois,setCalMois]=useState(()=>{const d=new Date();return{y:d.getFullYear(),m:d.getMonth()};});
  const prevMois=()=>setCalMois(({y,m})=>m===0?{y:y-1,m:11}:{y,m:m-1});
  const nextMois=()=>setCalMois(({y,m})=>m===11?{y:y+1,m:0}:{y,m:m+1});
  const premierJourMois=new Date(calMois.y,calMois.m,1);
  const dernierJourMois=new Date(calMois.y,calMois.m+1,0);
  const calDebut=lundiDe(premierJourMois);
  const calCases=[];
  for(let d=new Date(calDebut);d<=addDays(dernierJourMois,6);d=addDays(d,1)) calCases.push(new Date(d));

  /* ── AgendaSem (séances par case) ── */
  const [agendaSem,setAgendaSem]=useLS("maitresse_agenda_sem",{});
  const getCell=(dateISO,slotIdx)=>agendaSem?.[dateISO]?.[slotIdx]||null;
  const setCell=(dateISO,slotIdx,val)=>setAgendaSem({...agendaSem,[dateISO]:{...(agendaSem[dateISO]||{}),[slotIdx]:val}});
  const clearCell=(dateISO,slotIdx)=>{
    const copy={...agendaSem};
    if(copy[dateISO])delete copy[dateISO][slotIdx];
    setAgendaSem(copy);
  };
  const getCellOrEDT=(dateISO,slotIdx)=>{
    const existing=getCell(dateISO,slotIdx);
    if(existing!==null&&existing!==undefined)return existing;
    const jourNom=JOURS[semDates.findIndex(d=>isoDate(d)===dateISO)];
    if(!jourNom)return null;
    const slot=creneaux[slotIdx];
    const edtVal=emploi?.[jourNom]?.[slot];
    if(!edtVal)return null;
    const mat=typeof edtVal==="object"?edtVal.matiere:edtVal;
    const seq=typeof edtVal==="object"?edtVal.sequence:"";
    return {type:"seance",matiere:mat,sequence:seq,annule:false};
  };
  const toggleAnnule=(dateISO,slotIdx)=>{
    const cur=getCellOrEDT(dateISO,slotIdx)||{};
    setCell(dateISO,slotIdx,{...cur,annule:!cur.annule});
  };

  /* ── Événements ponctuels ── */
  const [showAddEv,setShowAddEv]=useState(false);
  const [editEvId,setEditEvId]=useState(null); // id de l'évent en cours d'édition
  const emptyForm={titre:"",date:today,heureDebut:"",heureFin:"",type:"Sortie scolaire",notes:"",annuleSlots:[]};
  const [formEv,setFormEv]=useState(emptyForm);

  const evDeLaSemaine=agenda.filter(ev=>semDates.some(d=>isoDate(d)===ev.date));

  const openAddEv=()=>{setFormEv(emptyForm);setEditEvId(null);setShowAddEv(true);};
  const openEditEv=(ev)=>{setFormEv({...emptyForm,...ev});setEditEvId(ev.id);setShowAddEv(true);};

  const saveEvent=()=>{
    if(!formEv.titre.trim())return;
    if(editEvId){
      // Mise à jour
      setAgenda(agenda.map(e=>e.id===editEvId?{...e,...formEv}:e).sort((a,b)=>a.date>b.date?1:-1));
    } else {
      const ev={id:Date.now(),...formEv};
      setAgenda([...agenda,ev].sort((a,b)=>a.date>b.date?1:-1));
      // Annuler les cases sélectionnées
      if(formEv.annuleSlots.length>0){
        const copy={...agendaSem};
        formEv.annuleSlots.forEach(slotIdx=>{
          const cur=getCellOrEDT(formEv.date,slotIdx);
          copy[formEv.date]={...(copy[formEv.date]||{}),[slotIdx]:{...(cur||{}),annule:true,eventTitre:formEv.titre}};
        });
        setAgendaSem(copy);
      }
    }
    setFormEv(emptyForm);setEditEvId(null);setShowAddEv(false);
  };

  const delEvent=id=>setAgenda(agenda.filter(e=>e.id!==id));

  /* ── Drag & drop événements ponctuels ── */
  // dragType distingue "event" (ponctuel) vs "prog" (progression)
  const [dragOver,setDragOver]=useState(null);         // {dateISO, slotIdx} pour cases séances
  const [dragOverDay,setDragOverDay]=useState(null);   // dateISO pour événements ponctuels

  // Drag séance/progression
  const onDragStartProg=(e,matiere,sequence)=>{
    e.dataTransfer.setData("dtype","prog");
    e.dataTransfer.setData("matiere",matiere);
    e.dataTransfer.setData("sequence",sequence||"");
  };
  const onDragOverCell=(e,dateISO,slotIdx)=>{
    if(e.dataTransfer.types.includes("dtype")){e.preventDefault();}
    setDragOver({dateISO,slotIdx});
  };
  const onDropCell=(e,dateISO,slotIdx)=>{
    e.preventDefault();
    const dtype=e.dataTransfer.getData("dtype");
    if(dtype==="prog"){
      const matiere=e.dataTransfer.getData("matiere");
      const sequence=e.dataTransfer.getData("sequence");
      if(matiere){
        const cur=getCellOrEDT(dateISO,slotIdx)||{};
        setCell(dateISO,slotIdx,{...cur,type:"seance",matiere,sequence,annule:false});
      }
    }
    setDragOver(null);
  };

  // Drag événement ponctuel
  const onDragStartEv=(e,evId)=>{
    e.dataTransfer.setData("dtype","event");
    e.dataTransfer.setData("evid",String(evId));
    e.dataTransfer.effectAllowed="move";
  };
  const onDragOverDay=(e,dateISO)=>{
    if(e.dataTransfer.types.includes("dtype")){e.preventDefault();}
    setDragOverDay(dateISO);
  };
  const onDropDay=(e,dateISO)=>{
    e.preventDefault();
    const dtype=e.dataTransfer.getData("dtype");
    if(dtype==="event"){
      const evid=parseInt(e.dataTransfer.getData("evid"));
      setAgenda(agenda.map(ev=>ev.id===evid?{...ev,date:dateISO}:ev).sort((a,b)=>a.date>b.date?1:-1));
    }
    setDragOverDay(null);
  };

  /* ── Drag progressions panneau ── */
  const [matSel,setMatSel]=useState(mats[0]);
  const [showPanel,setShowPanel]=useState(true);
  const seqsMatiere=progressions[matSel]||[];
  const planifiees=new Set(
    Object.values(agendaSem||{}).flatMap(j=>Object.values(j).map(v=>v?.sequence||"")).filter(Boolean)
  );

  return(
    <div style={{animation:"fadeIn .3s ease"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16,flexWrap:"wrap",gap:8}}>
        <h2 style={{fontFamily:"Lora,serif"}}>📅 Agenda de classe</h2>
        <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
          <Btn sm v="secondary" onClick={()=>setShowPanel(!showPanel)}>{showPanel?"Masquer progressions ←":"→ Progressions"}</Btn>
          <Btn sm v="gold" onClick={openAddEv}>+ Événement ponctuel</Btn>
        </div>
      </div>

      {/* ── Formulaire événement ponctuel ── */}
      {showAddEv&&(
        <Card style={{marginBottom:16,borderLeft:`4px solid ${C.terra}`}}>
          <h3 style={{fontFamily:"Lora,serif",fontSize:15,marginBottom:12,color:C.terra}}>
            {editEvId?"Modifier l'événement":"Nouvel événement ponctuel"}
          </h3>
          <div style={{display:"grid",gridTemplateColumns:"2fr 1fr 1fr",gap:12,marginBottom:12}}>
            <div><Lbl>Intitulé</Lbl><Inp value={formEv.titre} onChange={v=>setFormEv({...formEv,titre:v})} placeholder="ex: Sortie au musée"/></div>
            <div><Lbl>Date</Lbl><input type="date" value={formEv.date} onChange={e=>setFormEv({...formEv,date:e.target.value})} style={{width:"100%",border:`1.5px solid ${C.border}`,borderRadius:10,padding:"9px 14px",fontFamily:"inherit",fontSize:14,color:C.ink,background:C.cream,outline:"none",boxSizing:"border-box"}}/></div>
            <div><Lbl>Type</Lbl><Sel value={formEv.type} onChange={v=>setFormEv({...formEv,type:v})} options={TYPES_EV.map(t=>({value:t,label:t}))} style={{width:"100%"}}/></div>
            <div><Lbl>Heure de début</Lbl><TimeInput value={formEv.heureDebut} onChange={v=>setFormEv({...formEv,heureDebut:v})}/></div>
            <div><Lbl>Heure de fin</Lbl><TimeInput value={formEv.heureFin} onChange={v=>setFormEv({...formEv,heureFin:v})}/></div>
            <div style={{gridColumn:"1/-1"}}><Lbl>Notes</Lbl><Inp value={formEv.notes} onChange={v=>setFormEv({...formEv,notes:v})} placeholder="Détails…"/></div>
          </div>
          {/* Créneaux annulés — seulement en création */}
          {!editEvId&&formEv.date&&(()=>{
            const jourNom=JOURS[semDates.findIndex(d=>isoDate(d)===formEv.date)];
            if(!jourNom) return <p style={{fontSize:13,color:C.muted,fontStyle:"italic",marginBottom:12}}>Date hors de la semaine affichée — navigue vers la bonne semaine pour sélectionner les créneaux annulés.</p>;
            return(
              <div style={{marginBottom:12}}>
                <Lbl>Créneaux annulés ce jour-là (optionnel)</Lbl>
                <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
                  {creneaux.map((slot,idx)=>{
                    const sel=formEv.annuleSlots.includes(idx);
                    const cell=getCellOrEDT(formEv.date,idx);
                    return <button key={idx} onClick={()=>setFormEv(f=>({...f,annuleSlots:sel?f.annuleSlots.filter(x=>x!==idx):[...f.annuleSlots,idx]}))}
                      style={{padding:"5px 12px",borderRadius:8,border:`2px solid ${sel?C.terra:C.border}`,background:sel?"#fee2e2":C.white,fontFamily:"inherit",fontSize:12,fontWeight:600,cursor:"pointer",color:sel?C.terra:C.muted}}>
                      {slot}{cell?.matiere?` — ${cell.matiere}`:""}
                    </button>;
                  })}
                </div>
              </div>
            );
          })()}
          <div style={{display:"flex",gap:8}}>
            <Btn sm onClick={saveEvent}>✅ {editEvId?"Mettre à jour":"Enregistrer"}</Btn>
            <Btn sm v="ghost" onClick={()=>{setShowAddEv(false);setEditEvId(null);}}>Annuler</Btn>
          </div>
        </Card>
      )}

      <div style={{display:"grid",gridTemplateColumns:showPanel?"1fr 260px":"1fr",gap:16,alignItems:"start"}}>
        <div>
          {/* Nav semaine + mini-calendrier */}
          <div style={{display:"flex",gap:12,marginBottom:14,alignItems:"flex-start",flexWrap:"wrap"}}>
            <Card style={{padding:"12px 16px",flex:1,minWidth:280}}>
              <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:6}}>
                <button onClick={prevSem} style={{border:`1px solid ${C.border}`,background:C.white,borderRadius:8,padding:"4px 10px",cursor:"pointer",fontFamily:"inherit",fontSize:14}}>◀</button>
                <span style={{flex:1,textAlign:"center",fontSize:13,fontWeight:700,color:C.ink}}>{labelSem}</span>
                <button onClick={nextSem} style={{border:`1px solid ${C.border}`,background:C.white,borderRadius:8,padding:"4px 10px",cursor:"pointer",fontFamily:"inherit",fontSize:14}}>▶</button>
                <Btn sm v="secondary" onClick={()=>setLundi(lundiDe(new Date()))}>Auj.</Btn>
              </div>
              {evDeLaSemaine.length>0&&(
                <div style={{display:"flex",gap:6,flexWrap:"wrap",marginTop:6}}>
                  {evDeLaSemaine.map(ev=>(
                    <div key={ev.id} draggable onDragStart={e=>onDragStartEv(e,ev.id)}
                      style={{background:TC[ev.type]||"#e8e8e8",border:`1.5px solid ${TC_BORDER[ev.type]||"#ccc"}`,borderRadius:8,padding:"4px 10px",fontSize:11,fontWeight:700,color:C.ink,display:"flex",gap:6,alignItems:"center",cursor:"grab",userSelect:"none"}}>
                      <span>📌</span>
                      <span>{ev.titre}</span>
                      {(ev.heureDebut||ev.heureFin)&&(
                        <span style={{fontSize:10,color:C.muted,fontWeight:400}}>{ev.heureDebut||""}{ev.heureFin?" → "+ev.heureFin:""}</span>
                      )}
                      <button onClick={()=>openEditEv(ev)} style={{border:"none",background:"none",cursor:"pointer",color:C.muted,fontSize:11,padding:0}} title="Modifier">✎</button>
                      <button onClick={()=>delEvent(ev.id)} style={{border:"none",background:"none",cursor:"pointer",color:C.muted,fontSize:12,padding:0}}>✕</button>
                    </div>
                  ))}
                </div>
              )}
              <p style={{fontSize:10,color:C.muted,marginTop:evDeLaSemaine.length>0?6:0,fontStyle:"italic"}}>Glisse un événement 📌 sur une colonne de la grille pour le déplacer</p>
            </Card>
            {/* Mini-calendrier */}
            <Card style={{padding:"12px",minWidth:210}}>
              <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:8}}>
                <button onClick={prevMois} style={{border:"none",background:"none",cursor:"pointer",fontSize:13,color:C.sage}}>◀</button>
                <span style={{flex:1,textAlign:"center",fontSize:12,fontWeight:700,color:C.ink,textTransform:"capitalize"}}>
                  {premierJourMois.toLocaleDateString("fr-FR",{month:"long",year:"numeric"})}
                </span>
                <button onClick={nextMois} style={{border:"none",background:"none",cursor:"pointer",fontSize:13,color:C.sage}}>▶</button>
              </div>
              <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:2}}>
                {["L","M","M","J","V","S","D"].map((j,i)=><div key={i} style={{textAlign:"center",fontSize:10,fontWeight:700,color:C.muted,padding:"2px 0"}}>{j}</div>)}
                {calCases.map((d,i)=>{
                  const iso=isoDate(d);
                  const estCeMois=d.getMonth()===calMois.m;
                  const estAujourd=iso===today;
                  const estLundi=isoDate(lundi)===iso;
                  const estSemSel=d>=lundi&&d<addDays(lundi,5)&&estCeMois;
                  const aEv=agenda.some(ev=>ev.date===iso);
                  return <div key={i} onClick={()=>{if(estCeMois){setLundi(lundiDe(d));setCalMois({y:d.getFullYear(),m:d.getMonth()});}}}
                    style={{textAlign:"center",fontSize:11,padding:"3px 2px",borderRadius:6,cursor:estCeMois?"pointer":"default",
                      background:estLundi?"#2d3a2e":estAujourd?C.sage:estSemSel?C.sagePale:"transparent",
                      color:estLundi?C.white:estAujourd?C.white:estCeMois?C.ink:"#ccc",
                      fontWeight:estAujourd||estLundi?700:400,position:"relative"}}>
                    {d.getDate()}
                    {aEv&&estCeMois&&<span style={{position:"absolute",bottom:1,left:"50%",transform:"translateX(-50%)",width:4,height:4,borderRadius:"50%",background:C.terra,display:"block"}}/>}
                  </div>;
                })}
              </div>
            </Card>
          </div>

          {/* Grille semaine */}
          <Card style={{overflowX:"auto",padding:10}}>
            <table style={{width:"100%",borderCollapse:"collapse",minWidth:500}}>
              <thead>
                {/* Ligne drop événements ponctuels */}
                <tr>
                  <th style={{padding:"4px 8px",fontSize:10,color:C.muted,fontWeight:600,borderBottom:`1px solid ${C.border}`}}>↕ Déplacer</th>
                  {semDates.map((d,i)=>{
                    const dateISO=isoDate(d);
                    const isToday=dateISO===today;
                    const isOver=dragOverDay===dateISO;
                    const evsDuJour=agenda.filter(ev=>ev.date===dateISO);
                    return(
                      <th key={i} style={{padding:"4px 4px",borderBottom:`1px solid ${C.border}`,verticalAlign:"top"}}
                        onDragOver={e=>onDragOverDay(e,dateISO)}
                        onDragLeave={()=>setDragOverDay(null)}
                        onDrop={e=>onDropDay(e,dateISO)}>
                        <div style={{minHeight:28,borderRadius:8,padding:"3px 4px",background:isOver?"#d4edda":evsDuJour.length>0?TC[evsDuJour[0].type]||"#f0f0f0":"transparent",border:isOver?`2px dashed ${C.sage}`:"2px solid transparent",transition:"background .12s"}}>
                          {evsDuJour.map(ev=>(
                            <div key={ev.id} draggable onDragStart={e=>onDragStartEv(e,ev.id)}
                              style={{fontSize:10,fontWeight:700,color:C.ink,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis",cursor:"grab",display:"flex",alignItems:"center",gap:3}}>
                              📌 {ev.titre}
                              {ev.heureDebut&&<span style={{fontWeight:400,color:C.muted}}>{ev.heureDebut}{ev.heureFin?"–"+ev.heureFin:""}</span>}
                            </div>
                          ))}
                          {evsDuJour.length===0&&isOver&&<div style={{fontSize:10,color:C.sage,textAlign:"center"}}>Déposer ici</div>}
                        </div>
                      </th>
                    );
                  })}
                </tr>
                {/* Ligne jours */}
                <tr>
                  <th style={{padding:"6px 8px",fontSize:11,color:C.muted,fontWeight:700,borderBottom:`2px solid ${C.border}`,textAlign:"left",whiteSpace:"nowrap",minWidth:110}}>Créneaux</th>
                  {semDates.map((d,i)=>{
                    const iso=isoDate(d);
                    const isToday=iso===today;
                    return <th key={i} style={{padding:"6px 8px",fontSize:12,color:isToday?C.sage:C.ink,fontWeight:isToday?800:700,borderBottom:`2px solid ${isToday?C.sage:C.border}`,textAlign:"center",whiteSpace:"nowrap"}}>
                      <span style={{textTransform:"capitalize"}}>{labelJour(d)}</span>
                    </th>;
                  })}
                </tr>
              </thead>
              <tbody>
                {creneaux.map((slot,slotIdx)=>(
                  <tr key={slotIdx}>
                    <td style={{padding:"6px 8px",fontSize:11,color:C.muted,fontWeight:600,borderBottom:`1px solid ${C.border}`,whiteSpace:"nowrap"}}>{slot}</td>
                    {semDates.map((d,di)=>{
                      const dateISO=isoDate(d);
                      const cell=getCellOrEDT(dateISO,slotIdx);
                      const isOver=dragOver?.dateISO===dateISO&&dragOver?.slotIdx===slotIdx;
                      const fromEDT=!getCell(dateISO,slotIdx)&&!!cell;
                      return(
                        <td key={di} style={{padding:3,borderBottom:`1px solid ${C.border}`}}
                          onDragOver={e=>onDragOverCell(e,dateISO,slotIdx)}
                          onDragLeave={()=>setDragOver(null)}
                          onDrop={e=>onDropCell(e,dateISO,slotIdx)}>
                          <div style={{
                            minHeight:52,padding:"4px 6px",borderRadius:8,position:"relative",
                            background:cell?.annule?"#fee2e2":isOver?"#d4edda":cell?.matiere?MC[cell.matiere]||C.sagePale:"transparent",
                            border:isOver?`2px dashed ${C.sage}`:fromEDT?`1px dashed ${C.sageLight}`:`1px solid transparent`,
                            opacity:cell?.annule?.7:1,
                            display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",
                            transition:"background .12s",
                          }}>
                            {cell?.annule&&<span style={{fontSize:9,background:"#c0392b",color:"#fff",borderRadius:4,padding:"1px 5px",fontWeight:700,marginBottom:2,textTransform:"uppercase"}}>Annulé</span>}
                            {cell?.eventTitre&&cell?.annule&&<span style={{fontSize:9,color:"#c0392b",textAlign:"center",lineHeight:1.2}}>{cell.eventTitre.slice(0,18)}</span>}
                            {cell?.matiere&&<span style={{fontSize:11,fontWeight:700,color:C.ink,textAlign:"center",textDecoration:cell.annule?"line-through":"none"}}>{cell.matiere}</span>}
                            {cell?.sequence&&<span style={{fontSize:9,color:C.muted,textAlign:"center",lineHeight:1.2,marginTop:1}}>{cell.sequence.length>22?cell.sequence.slice(0,20)+"…":cell.sequence}</span>}
                            {!cell&&!isOver&&<span style={{color:C.border,fontSize:16}}>+</span>}
                            {cell&&(
                              <div style={{position:"absolute",top:2,right:2,display:"flex",gap:2}}>
                                <button onClick={()=>toggleAnnule(dateISO,slotIdx)} title={cell.annule?"Réactiver":"Annuler"} style={{border:"none",background:"none",cursor:"pointer",fontSize:10,padding:0,opacity:.7,color:cell.annule?"#2e7d32":"#c0392b"}}>{cell.annule?"↩":"🚫"}</button>
                                <button onClick={()=>clearCell(dateISO,slotIdx)} style={{border:"none",background:"none",cursor:"pointer",fontSize:11,padding:0,opacity:.6,color:C.muted}}>✕</button>
                              </div>
                            )}
                          </div>
                        </td>
                      );
                    })}
                  </tr>
                ))}
              </tbody>
            </table>
            <p style={{marginTop:8,fontSize:11,color:C.muted}}>Pointillés = depuis l'EDT · Glisse une séquence dans une case · 🚫 annuler · ↩ réactiver · ✕ effacer</p>
          </Card>
        </div>

        {/* Panneau progressions */}
        {showPanel&&(
          <div style={{display:"flex",flexDirection:"column",gap:10}}>
            <Card style={{padding:"14px 16px"}}>
              <p style={{fontSize:12,fontWeight:700,color:C.muted,marginBottom:10,textTransform:"uppercase",letterSpacing:"0.05em"}}>Matière</p>
              <div style={{display:"flex",flexDirection:"column",gap:4}}>
                {mats.map(m=><button key={m} onClick={()=>setMatSel(m)} style={{padding:"7px 12px",borderRadius:8,border:"none",cursor:"pointer",fontFamily:"inherit",fontSize:13,fontWeight:600,textAlign:"left",transition:"all .15s",background:matSel===m?C.sage:C.sagePale,color:matSel===m?C.white:C.sage}}>{m}</button>)}
              </div>
            </Card>
            <Card style={{padding:"14px 16px"}}>
              <p style={{fontSize:12,fontWeight:700,color:C.muted,marginBottom:4,textTransform:"uppercase",letterSpacing:"0.05em"}}>Séquences — {matSel}</p>
              <p style={{fontSize:11,color:C.muted,marginBottom:10,fontStyle:"italic"}}>Glisse vers une case →</p>
              <div draggable onDragStart={e=>onDragStartProg(e,matSel,"")}
                style={{padding:"8px 12px",borderRadius:8,marginBottom:8,background:MC[matSel]||C.sagePale,border:`1px solid ${C.border}`,cursor:"grab",fontSize:12,fontWeight:700,color:C.ink,display:"flex",alignItems:"center",gap:6,userSelect:"none"}}>
                <span>☰</span>{matSel}<span style={{fontSize:10,color:C.muted,fontWeight:400,marginLeft:"auto"}}>(matière seule)</span>
              </div>
              {seqsMatiere.length===0&&<p style={{fontSize:12,color:C.muted,fontStyle:"italic"}}>Ajoute des séquences dans Progressions.</p>}
              <div style={{display:"flex",flexDirection:"column",gap:6,maxHeight:400,overflowY:"auto"}}>
                {seqsMatiere.map(seq=>{
                  const placed=planifiees.has(seq.text);
                  return(
                    <div key={seq.id} draggable={!seq.done} onDragStart={e=>onDragStartProg(e,matSel,seq.text)}
                      style={{padding:"9px 12px",borderRadius:8,background:seq.done?"#f0f0f0":placed?"#e8f5e9":C.warm,border:`1px solid ${seq.done?"#ddd":placed?"#81c784":"#ecdfd4"}`,cursor:seq.done?"not-allowed":"grab",opacity:seq.done?.5:1,userSelect:"none"}}>
                      <div style={{display:"flex",gap:6}}>
                        <span style={{fontSize:12}}>{seq.done?"✅":placed?"📌":"⋮⋮"}</span>
                        <span style={{fontSize:12,color:C.ink,lineHeight:1.4,flex:1}}>{seq.text}</span>
                      </div>
                      {placed&&!seq.done&&<div style={{fontSize:10,color:"#2e7d32",marginTop:3,marginLeft:18,fontWeight:600}}>Déjà placée</div>}
                    </div>
                  );
                })}
              </div>
            </Card>
          </div>
        )}
      </div>
    </div>
  );
}

/* ════════════════════════════════════════════════════
   JOURNAL DE BORD (composant réutilisable)
════════════════════════════════════════════════════ */
function JournalBord({eleves,setEleves,journal,setJournal,setSection,setSectionEleve}){
  const [txt,setTxt]=useState("");
  const [flash,setFlash]=useState(null); // {text, eleveNom}
  const today=new Date().toLocaleDateString("fr-FR");
  const todayISO=new Date().toISOString().split("T")[0];

  // Détecte les prénoms d'élèves mentionnés dans le texte
  const detecterEleves=(texte,listeEleves)=>{
    return listeEleves.filter(e=>{
      const prenom=e.nom.trim().toLowerCase();
      const mots=texte.toLowerCase().split(/\s+|[,;.!?]/);
      return mots.some(m=>m===prenom||m===prenom+"s"||m===prenom+"'");
    });
  };

  const ajouter=()=>{
    if(!txt.trim())return;
    const dateHeure=new Date().toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"});
    const entry={id:Date.now(),date:today,dateISO:todayISO,heure:dateHeure,texte:txt.trim()};

    // Détecter les élèves mentionnés
    const mentionnes=detecterEleves(txt,eleves);

    // Reporter sur les fiches élèves
    if(mentionnes.length>0){
      const noteTexte=`[Journal] ${txt.trim()}`;
      setEleves(eleves.map(e=>
        mentionnes.find(m=>m.id===e.id)
          ?{...e,notes:[...e.notes,{date:today,text:noteTexte,fromJournal:true}]}
          :e
      ));
      setFlash({texte:txt.trim(),noms:mentionnes.map(e=>e.nom)});
      setTimeout(()=>setFlash(null),4000);
    }

    setJournal([entry,...journal]);
    setTxt("");
  };

  const supprimerEntry=id=>setJournal(journal.filter(e=>e.id!==id));

  const parJour=journal.reduce((acc,e)=>{
    if(!acc[e.dateISO])acc[e.dateISO]=[];
    acc[e.dateISO].push(e);
    return acc;
  },{});
  const jours=Object.keys(parJour).sort((a,b)=>b>a?1:-1).slice(0,7);

  return(
    <div>
      <h3 style={{fontFamily:"Lora,serif",fontSize:16,color:C.ink,marginBottom:12}}>
        📝 Journal de bord du jour
        <span style={{fontSize:12,color:C.muted,fontWeight:400,marginLeft:8}}>{today}</span>
      </h3>

      {/* Saisie rapide */}
      <div style={{display:"flex",gap:10,marginBottom:10,alignItems:"flex-start"}}>
        <div style={{flex:1,position:"relative"}}>
          <Inp
            value={txt}
            onChange={setTxt}
            placeholder="Antoine a vomi à 10h… Lucie n'arrive pas à faire la soustraction… Les prénoms sont automatiquement liés aux fiches élèves."
            multi rows={2}
            onKD={e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();ajouter();}}}
            style={{paddingRight:eleves.length>0?14:14}}
          />
          {/* Aperçu des prénoms détectés */}
          {txt.trim()&&eleves.length>0&&(()=>{
            const det=detecterEleves(txt,eleves);
            return det.length>0?(
              <div style={{position:"absolute",bottom:-24,left:0,fontSize:11,color:C.sage,fontWeight:600}}>
                🔗 Sera lié à : {det.map(e=>e.nom).join(", ")}
              </div>
            ):null;
          })()}
        </div>
        <Btn onClick={ajouter} sm style={{flexShrink:0,marginTop:2}}>+ Ajouter</Btn>
      </div>

      {/* Flash confirmation */}
      {flash&&(
        <div style={{background:"#e8f5e9",border:"1px solid #81c784",borderRadius:10,padding:"8px 14px",marginTop:16,marginBottom:8,fontSize:13,color:"#2e7d32",display:"flex",alignItems:"center",gap:8,animation:"fadeIn .2s ease"}}>
          ✅ Note ajoutée sur la fiche de <strong>{flash.noms.join(", ")}</strong>
          <button onClick={()=>{setSection("eleves");if(setSectionEleve)setSectionEleve(flash.noms[0]);}} style={{border:"none",background:"none",cursor:"pointer",color:C.sage,fontWeight:700,fontSize:12,fontFamily:"inherit",marginLeft:4,textDecoration:"underline"}}>Voir la fiche →</button>
        </div>
      )}

      {/* Historique groupé par jour */}
      {jours.length>0&&(
        <div style={{marginTop:20,maxHeight:340,overflowY:"auto"}}>
          {jours.map(dateISO=>{
            const entries=parJour[dateISO];
            const label=dateISO===todayISO?"Aujourd'hui":new Date(dateISO+"T12:00:00").toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"});
            return(
              <div key={dateISO} style={{marginBottom:16}}>
                <div style={{fontSize:11,fontWeight:700,color:C.muted,textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:8,paddingBottom:4,borderBottom:`1px solid ${C.border}`}}>{label}</div>
                <div style={{display:"flex",flexDirection:"column",gap:6}}>
                  {entries.map(e=>{
                    // Trouver les élèves liés
                    const lies=eleves.filter(el=>
                      el.notes.some(n=>n.fromJournal&&n.text===`[Journal] ${e.texte}`&&n.date===e.date)
                    );
                    return(
                      <div key={e.id} style={{display:"flex",gap:10,alignItems:"flex-start",padding:"9px 12px",borderRadius:10,background:dateISO===todayISO?C.warm:C.sagePale,border:`1px solid ${dateISO===todayISO?"#ecdfd4":C.sageLight}`}}>
                        <span style={{fontSize:11,color:C.muted,fontWeight:700,whiteSpace:"nowrap",marginTop:2}}>{e.heure}</span>
                        <p style={{flex:1,margin:0,fontSize:13,color:C.ink,lineHeight:1.5}}>
                          <EditInline value={e.texte} onChange={v=>setJournal(journal.map(j=>j.id===e.id?{...j,texte:v}:j))} multi/>
                        </p>
                        {lies.length>0&&(
                          <div style={{display:"flex",gap:4,flexWrap:"wrap",flexShrink:0}}>
                            {lies.map(el=>(
                              <button key={el.id} onClick={()=>setSection("eleves")} style={{background:C.sagePale,border:`1px solid ${C.sageLight}`,borderRadius:12,padding:"2px 8px",fontSize:11,fontWeight:700,color:C.sage,cursor:"pointer",fontFamily:"inherit"}}>
                                👤 {el.nom}
                              </button>
                            ))}
                          </div>
                        )}
                        <button onClick={()=>supprimerEntry(e.id)} style={{border:"none",background:"none",cursor:"pointer",color:C.muted,fontSize:13,flexShrink:0}}>✕</button>
                      </div>
                    );
                  })}
                </div>
              </div>
            );
          })}
        </div>
      )}
      {journal.length===0&&(
        <p style={{color:C.muted,fontSize:13,fontStyle:"italic",marginTop:8}}>Aucune note aujourd'hui. Commence à écrire !</p>
      )}
    </div>
  );
}

/* ════════════════════════════════════════════════════
   DASHBOARD
════════════════════════════════════════════════════ */
function Dashboard({config,taches,eleves,setEleves,evaluations,agenda,journal,setJournal,setSection,apiKey}){
  const today=new Date().toISOString().split("T")[0];
  const now=new Date();
  const greet=now.getHours()<12?"Bonjour":now.getHours()<18?"Bon après-midi":"Bonsoir";
  const kpis=[
    {label:"Tâches en cours",value:taches.filter(t=>!t.done).length,icon:"📋",sec:"taches",color:C.warm},
    {label:"Élèves en APC",value:eleves.filter(e=>e.apc).length,icon:"🎯",sec:"eleves",color:"#fce7f3"},
    {label:"Évaluations",value:evaluations.length,icon:"✅",sec:"evaluations",color:C.sagePale},
    {label:"Événements à venir",value:agenda.filter(e=>e.date>=today).length,icon:"📅",sec:"agenda",color:"#fff3cd"},
  ];
  const nextEvts=agenda.filter(e=>e.date>=today).slice(0,3);
  const pendingT=taches.filter(t=>!t.done).slice(0,4);
  const urgentEvts=agenda.filter(e=>{const d=Math.ceil((new Date(e.date+"T12:00:00")-now)/(1000*60*60*24));return d>=0&&d<=3;});

  return(
    <div style={{animation:"fadeIn .3s ease"}}>
      <div style={{marginBottom:22}}>
        <h2 style={{margin:0,fontSize:26,color:C.ink,fontFamily:"Lora,serif"}}>{greet}, {config.prenom||"Maîtresse"} 👋</h2>
        <p style={{color:C.muted,marginTop:6,fontSize:14}}>{now.toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long",year:"numeric"})}{config.niveau&&` · Classe de ${config.niveau}`}{config.nbEleves&&` · ${config.nbEleves} élèves`}</p>
      </div>

      {urgentEvts.length>0&&(
        <div style={{background:"#fff9e6",border:"1px solid #f0c94a",borderRadius:12,padding:"10px 18px",marginBottom:16,fontSize:13,color:"#7a5c00"}}>
          ⚠️ Événement{urgentEvts.length>1?"s":""} proche{urgentEvts.length>1?"s":""} : {urgentEvts.map(e=>e.titre).join(", ")}
        </div>
      )}

      {/* KPIs */}
      <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:12,marginBottom:20}}>
        {kpis.map(k=>(
          <div key={k.sec} onClick={()=>setSection(k.sec)} style={{background:k.color,borderRadius:14,padding:"14px 16px",cursor:"pointer",border:`1px solid ${C.border}`,transition:"transform .15s"}}
            onMouseEnter={e=>e.currentTarget.style.transform="translateY(-2px)"}
            onMouseLeave={e=>e.currentTarget.style.transform=""}>
            <div style={{fontSize:20,marginBottom:4}}>{k.icon}</div>
            <div style={{fontSize:24,fontWeight:800,color:C.ink,fontFamily:"Lora,serif"}}>{k.value}</div>
            <div style={{fontSize:12,color:C.muted,fontWeight:600}}>{k.label}</div>
          </div>
        ))}
      </div>

      {/* Journal de bord — pleine largeur */}
      <Card style={{marginBottom:16,borderLeft:`4px solid ${C.terra}`}}>
        <JournalBord
          eleves={eleves}
          setEleves={setEleves}
          journal={journal}
          setJournal={setJournal}
          setSection={setSection}
        />
      </Card>

      {/* Tâches + Agenda */}
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:16,marginBottom:16}}>
        <Card>
          <h3 style={{margin:"0 0 12px",fontSize:14,color:C.ink,fontFamily:"Lora,serif"}}>📋 Tâches à faire</h3>
          {pendingT.length===0?<p style={{color:C.muted,fontSize:13,fontStyle:"italic"}}>Tout est à jour ! 🌿</p>:pendingT.map(t=>(
            <div key={t.id} style={{display:"flex",alignItems:"center",gap:10,padding:"6px 0",borderBottom:`1px solid ${C.border}`}}>
              <span style={{fontSize:14,color:C.ink,flex:1}}>{t.text}</span>
              <Badge label={t.cat}/>
            </div>
          ))}
          <Btn sm v="secondary" onClick={()=>setSection("taches")} style={{marginTop:12}}>Voir tout →</Btn>
        </Card>
        <Card>
          <h3 style={{margin:"0 0 12px",fontSize:14,color:C.ink,fontFamily:"Lora,serif"}}>📅 Prochains événements</h3>
          {nextEvts.length===0?<p style={{color:C.muted,fontSize:13,fontStyle:"italic"}}>Aucun événement proche.</p>:nextEvts.map(ev=>(
            <div key={ev.id} style={{display:"flex",gap:12,padding:"7px 0",borderBottom:`1px solid ${C.border}`,alignItems:"center"}}>
              <div style={{minWidth:32,textAlign:"center"}}>
                <div style={{fontSize:15,fontWeight:800,color:C.sage,fontFamily:"Lora,serif"}}>{ev.date.split("-")[2]}</div>
                <div style={{fontSize:9,color:C.muted,textTransform:"uppercase"}}>{new Date(ev.date+"T12:00:00").toLocaleDateString("fr-FR",{month:"short"})}</div>
              </div>
              <span style={{fontSize:13,color:C.ink,flex:1}}>{ev.titre}</span>
            </div>
          ))}
          <Btn sm v="secondary" onClick={()=>setSection("agenda")} style={{marginTop:12}}>Voir tout →</Btn>
        </Card>
      </div>

      <Card style={{background:"linear-gradient(135deg,#e8f0e9 0%,#faf8f3 100%)",border:`1px solid ${C.sageLight}`}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:12,flexWrap:"wrap"}}>
          <div>
            <h3 style={{margin:"0 0 4px",color:C.ink,fontFamily:"Lora,serif"}}>📓 Préparer le cahier journal</h3>
            <p style={{margin:0,fontSize:13,color:C.muted}}>{apiKey?"L'IA peut rédiger ton cahier journal complet en quelques secondes.":"Renseigne tes séances et génère une mise en page propre."}</p>
          </div>
          <Btn onClick={()=>setSection("cahier")} v="gold">Ouvrir →</Btn>
        </div>
      </Card>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);</script>
</body>
</html>
